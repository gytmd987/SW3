<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>로스트 시티</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Song+Myung&family=Gowun+Dodum&family=Cinzel:wght@600;800&display=swap">
<link rel="stylesheet" href="../shared/duo.css">
<style>
/* Layout: an explorer's map table — rival expeditions on top, the five base-camp discard piles and the deck across the middle, your expeditions and hand below. */
:root {
  --bg: #e6dabd;
  --bg2: #f6efdd;
  --panel: rgba(250, 244, 228, .78);
  --line: rgba(74, 52, 26, .22);
  --fg: #2b2116;
  --muted: #6f5d45;
  --accent: #1e5a57;
  --accent-fg: #f6efdd;
  --danger: #a3352a;
  --ok: #2f7a4a;
  --sheet: #f6efdd;
  --scrim: rgba(40, 26, 10, .45);
  --f-display: "Song Myung", "Nanum Myeongjo", serif;
  --f-body: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-num: "Cinzel", "Song Myung", Georgia, serif;
  --Y: #e0a12c; --Y-d: #7d4f10;
  --B: #2f7db3; --B-d: #12395a;
  --W: #b9c7d4; --W-d: #4e6072;
  --G: #4c9647; --G-d: #1d4621;
  --R: #d0472e; --R-d: #681c11;
}
body {
  background-color: var(--bg);
  background-image:
    repeating-radial-gradient(circle at 18% 22%, transparent 0 22px, rgba(110, 78, 34, .09) 22px 23px),
    repeating-radial-gradient(circle at 82% 70%, transparent 0 26px, rgba(110, 78, 34, .07) 26px 27px),
    radial-gradient(120% 90% at 50% 40%, transparent 55%, rgba(90, 60, 20, .22));
  background-attachment: fixed;
}
.duo-title { font-family: var(--f-num); letter-spacing: .06em; font-weight: 800; }
.mark-lc { font-family: var(--f-num); font-weight: 800; font-size: 46px; color: var(--accent); letter-spacing: .08em; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.mark-lc .compass { width: 74px; height: 74px; }

.c-Y { --c: var(--Y); --d: var(--Y-d); } .c-B { --c: var(--B); --d: var(--B-d); } .c-W { --c: var(--W); --d: var(--W-d); }
.c-G { --c: var(--G); --d: var(--G-d); } .c-R { --c: var(--R); --d: var(--R-d); }

.lc-strip { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; font-size: 13px; color: var(--muted); padding: 8px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); }
.lc-strip b { color: var(--fg); font-family: var(--f-num); font-size: 15px; }
.lc-who { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.lc-who b { font-family: var(--f-display); font-size: 17px; color: var(--fg); font-weight: 400; }
.lc-who .turn { margin-left: auto; font-size: 12px; padding: 2px 10px; border-radius: 999px; background: var(--accent); color: var(--accent-fg); }
.lc-backs { display: flex; }
.lc-backs i { width: 12px; height: 17px; border-radius: 2px; margin-left: -4px; background: repeating-linear-gradient(45deg, #2c4f4d 0 3px, #24413f 3px 6px); border: 1px solid #c9b78f; }

.lc-cols { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.lc-col { display: flex; flex-direction: column; gap: 2px; min-height: 64px; padding: 4px; border-radius: 8px; border: 1px dashed var(--line); background: rgba(255, 252, 240, .35); position: relative; }
.lc-col.top { justify-content: flex-end; }
.lc-col.can { border: 1.5px solid var(--accent); background: rgba(30, 90, 87, .1); cursor: pointer; }
.lc-col .lbl { font-size: 10.5px; text-align: center; color: var(--d); letter-spacing: .02em; }
.lc-col .score { font-family: var(--f-num); font-size: 13px; text-align: center; font-weight: 800; }
.lc-col .score.neg { color: var(--danger); }
.lc-col .score.pos { color: var(--ok); }
.lc-chip { height: 19px; border-radius: 4px; display: flex; align-items: center; justify-content: space-between; padding: 0 5px; font-family: var(--f-num); font-weight: 800; font-size: 13px; color: #fff; background: linear-gradient(90deg, var(--d), var(--c)); box-shadow: 0 1px 0 rgba(0,0,0,.25); }
.lc-chip.c-W { color: #1d2a36; background: linear-gradient(90deg, #8ea0b2, #e4ebf1); }
.lc-chip .seal { width: 13px; height: 13px; border-radius: 50%; background: #8f1f16; color: #f6efdd; font-family: var(--f-body); font-size: 8px; display: grid; place-items: center; }
.lc-chip.new { animation: drop .5s ease-out; }
@keyframes drop { from { transform: translateY(-14px); opacity: 0; } to { transform: none; opacity: 1; } }

.lc-camp { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; padding: 10px 8px; border-radius: 14px; background: rgba(43, 33, 22, .08); border: 1px solid var(--line); }
.lc-pile { display: flex; flex-direction: column; align-items: center; gap: 3px; background: none; border: none; padding: 0; min-width: 0; }
.lc-pile .slot { width: 100%; aspect-ratio: 5 / 7; border-radius: 7px; border: 1.5px dashed var(--d); opacity: .55; display: grid; place-items: center; overflow: hidden; }
.lc-pile .slot svg { width: 80%; opacity: .5; }
.lc-pile .cnt { font-size: 10.5px; color: var(--muted); }
.lc-pile.can .lc-card, .lc-pile.can .slot { box-shadow: 0 0 0 2.5px var(--accent), 0 0 14px rgba(30, 90, 87, .5); }
.lc-pile:disabled { cursor: default; }
.lc-pile.blocked .lc-card { filter: grayscale(.6) brightness(.85); }
.lc-deck { margin-bottom: 7px; width: 100%; aspect-ratio: 5 / 7; border-radius: 7px; display: grid; place-items: center; color: #e8d9b4; font-family: var(--f-num); font-weight: 800; font-size: 18px; background: radial-gradient(circle at 50% 40%, #2f5a57, #183634); border: 2px solid #c9b78f; box-shadow: 0 3px 0 #0f2422, 0 5px 0 #c9b78f, 0 7px 0 #0f2422; }

.lc-card { position: relative; width: 100%; aspect-ratio: 5 / 7; border-radius: 7px; overflow: hidden; display: flex; flex-direction: column; background: var(--d); box-shadow: 0 2px 6px rgba(40, 25, 5, .35); border: 1.5px solid #f3e7c6; }
.lc-card .art { flex: 0 0 58%; display: block; }
.lc-card .art svg { display: block; width: 100%; height: 100%; }
.lc-card .val { flex: 1; display: grid; place-items: center; font-family: var(--f-num); font-weight: 800; color: #fff6dd; font-size: clamp(15px, 5vw, 24px); line-height: 1; text-shadow: 0 1px 0 rgba(0,0,0,.4); }
.lc-card.c-W .val { color: #f8fbff; }
.lc-card .corner { position: absolute; top: 2px; left: 4px; font-family: var(--f-num); font-weight: 800; font-size: 11px; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
.lc-card .stamp { width: 70%; aspect-ratio: 1; border-radius: 50%; border: 2px solid #f6d9a8; color: #fbe6c2; display: grid; place-items: center; font-family: var(--f-display); font-size: clamp(10px, 3vw, 14px); transform: rotate(-12deg); background: rgba(143, 31, 22, .85); }

.lc-hand { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 5px; }
.lc-hand button { padding: 0; border: none; background: none; transition: transform .15s ease; min-width: 0; }
.lc-hand button.sel { transform: translateY(-10px); }
.lc-hand button.sel .lc-card { box-shadow: 0 0 0 2.5px var(--accent), 0 8px 14px rgba(30, 50, 40, .4); }
.lc-hand button:disabled { cursor: default; }
.lc-hand .drawn .lc-card::after { content: "새"; position: absolute; top: 2px; right: 3px; font-size: 9px; padding: 0 4px; border-radius: 4px; background: #fff6dd; color: var(--accent); }
.lc-say { font-size: 13.5px; text-align: center; color: var(--fg); margin: 0; min-height: 1.5em; text-wrap: balance; }
.lc-say em { font-style: normal; color: var(--accent); font-weight: 700; }
.lc-actions { display: flex; gap: 8px; }
.lc-actions .duo-btn { flex: 1; }
.lc-sec { display: flex; flex-direction: column; gap: 6px; }
.lc-round { display: flex; flex-direction: column; gap: 10px; }
.lc-round td.c { width: 22px; }
.lc-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--c); border: 1px solid var(--d); vertical-align: middle; }
.rule-cards { display: flex; gap: 6px; }
.rule-cards .lc-card { width: 46px; }
@media (max-width: 380px) { .lc-hand { gap: 3px; } .lc-cols, .lc-camp { gap: 4px; } }
</style>
</head>
<body>
<div class="duo" id="app"></div>
<div id="layer"></div>
<script src="../shared/duo.js"></script>
<script>
(() => {
"use strict";
const { esc, shuffle, rnd } = DuoUtil;
const COLORS = ["Y", "B", "W", "G", "R"];
const CNAME = { Y: "사막", B: "바다", W: "설산", G: "밀림", R: "화산" };
const CFULL = { Y: "노랑 · 사막", B: "파랑 · 해저 신전", W: "하양 · 히말라야", G: "초록 · 열대 밀림", R: "빨강 · 화산" };

/* ───── card art (one small landscape per expedition) ───── */
const ART = {
  Y: `<svg viewBox="0 0 60 40" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="sy" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7c96a"/><stop offset="1" stop-color="#f2e2b0"/></linearGradient></defs><rect width="60" height="40" fill="url(#sy)"/><circle cx="44" cy="12" r="6" fill="#fff3c4"/><path d="M20 30 L30 14 L40 30Z" fill="#c98a2a"/><path d="M30 14 L40 30 L33 30Z" fill="#9c6614"/><path d="M0 32 Q15 24 30 31 T60 29 V40 H0Z" fill="#d99a35"/><path d="M0 36 Q20 30 40 36 T60 35 V40 H0Z" fill="#b8771c"/></svg>`,
  B: `<svg viewBox="0 0 60 40" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="sb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5fb2df"/><stop offset="1" stop-color="#16507e"/></linearGradient></defs><rect width="60" height="40" fill="url(#sb)"/><rect x="24" y="16" width="4" height="18" fill="#cfe6f2" opacity=".75"/><rect x="32" y="20" width="4" height="14" fill="#cfe6f2" opacity=".6"/><path d="M21 16 H39 L36 13 H24Z" fill="#cfe6f2" opacity=".75"/><path d="M0 10 Q7 7 15 10 T30 10 T45 10 T60 10" stroke="#e6f6ff" stroke-width="1.4" fill="none"/><path d="M0 34 Q10 30 20 34 T40 34 T60 34 V40 H0Z" fill="#0c3456"/><circle cx="12" cy="24" r="1" fill="#e6f6ff"/><circle cx="15" cy="19" r="1.4" fill="#e6f6ff"/><circle cx="46" cy="22" r="1.2" fill="#e6f6ff"/></svg>`,
  W: `<svg viewBox="0 0 60 40" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="sw" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9fb6cc"/><stop offset="1" stop-color="#e8eef3"/></linearGradient></defs><rect width="60" height="40" fill="url(#sw)"/><path d="M0 40 L18 12 L28 26 L38 8 L60 40Z" fill="#5f7385"/><path d="M18 12 L23 20 L20 19 L17 22 L14 18Z M38 8 L44 18 L40 16 L37 20 L33 16Z" fill="#fff"/><path d="M0 40 L12 28 L22 40Z" fill="#43566a"/><path d="M44 40 L52 30 L60 40Z" fill="#43566a"/></svg>`,
  G: `<svg viewBox="0 0 60 40" preserveAspectRatio="xMidYMid slice"><rect width="60" height="40" fill="#a9d18e"/><path d="M22 34 H38 V30 H35 V26 H32 V22 H28 V26 H25 V30 H22Z" fill="#7d7a5c"/><rect x="28.5" y="18" width="3" height="4" fill="#5e5b42"/><path d="M0 0 Q12 10 4 22 Q-2 14 0 0Z" fill="#2f6b2c"/><path d="M60 0 Q46 12 56 24 Q62 14 60 0Z" fill="#2f6b2c"/><path d="M10 40 Q4 26 16 18 Q14 30 10 40Z" fill="#3f8a3a"/><path d="M50 40 Q58 28 46 20 Q46 32 50 40Z" fill="#3f8a3a"/><path d="M0 36 Q30 30 60 36 V40 H0Z" fill="#245a24"/></svg>`,
  R: `<svg viewBox="0 0 60 40" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="sr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a1a22"/><stop offset="1" stop-color="#b8432c"/></linearGradient></defs><rect width="60" height="40" fill="url(#sr)"/><path d="M8 40 L25 14 H35 L52 40Z" fill="#3b211d"/><path d="M25 14 H35 L33 20 Q30 24 27 20Z" fill="#ff9a3c"/><path d="M29 20 Q27 30 24 40 H28 Q30 30 31 21Z" fill="#ff6a2a"/><circle cx="30" cy="9" r="4" fill="#6b5a5a" opacity=".8"/><circle cx="34" cy="5" r="3.5" fill="#6b5a5a" opacity=".6"/><circle cx="27" cy="4" r="3" fill="#6b5a5a" opacity=".5"/><circle cx="22" cy="12" r="1" fill="#ffb347"/><circle cx="39" cy="11" r="1" fill="#ffb347"/></svg>`,
};
const COMPASS = `<svg class="compass" viewBox="0 0 80 80" aria-hidden="true"><circle cx="40" cy="40" r="36" fill="none" stroke="#1e5a57" stroke-width="2"/><circle cx="40" cy="40" r="29" fill="none" stroke="#1e5a57" stroke-width="1" stroke-dasharray="2 3"/><path d="M40 6 L46 40 L40 74 L34 40Z" fill="#1e5a57"/><path d="M40 6 L46 40 L34 40Z" fill="#a3352a"/><path d="M6 40 L40 35 L74 40 L40 45Z" fill="#6f5d45"/><circle cx="40" cy="40" r="3.5" fill="#f6efdd" stroke="#1e5a57"/></svg>`;

function cardHTML(c, extra = "") {
  const lab = c.v ? `${CNAME[c.c]} ${c.v}` : `${CNAME[c.c]} 투자`;
  return `<div class="lc-card c-${c.c} ${extra}" aria-label="${lab}"><span class="art">${ART[c.c]}</span>${c.v ? `<span class="corner">${c.v}</span><span class="val">${c.v}</span>` : `<span class="val"><span class="stamp">투자</span></span>`}</div>`;
}
const chipHTML = (c, isNew) => `<div class="lc-chip c-${c.c} ${isNew ? "new" : ""}">${c.v ? `<span>${c.v}</span>` : `<span class="seal">투</span><span>×</span>`}</div>`;

/* ───── rules engine ───── */
const empty = () => ({ Y: [], B: [], W: [], G: [], R: [] });
function makeDeck() {
  const d = []; let id = 0;
  for (const c of COLORS) { for (let k = 0; k < 3; k++) d.push({ id: id++, c, v: 0 }); for (let v = 2; v <= 10; v++) d.push({ id: id++, c, v }); }
  return shuffle(d);
}
function expScore(col) {
  if (!col.length) return 0;
  const w = col.filter(c => c.v === 0).length;
  const sum = col.reduce((a, c) => a + c.v, 0);
  return (sum - 20) * (1 + w) + (col.length >= 8 ? 20 : 0);
}
const roundScore = exp => COLORS.reduce((a, c) => a + expScore(exp[c]), 0);
function canPlay(col, card) {
  if (!col.length) return true;
  const top = col[col.length - 1];
  if (card.v === 0) return top.v === 0;
  return card.v > top.v;
}
function deal(g, first, names) {
  g.round += 1;
  const d = makeDeck();
  g.hands = [d.splice(0, 8), d.splice(0, 8)];
  g.deck = d; g.exp = [empty(), empty()]; g.discard = empty();
  g.turn = first; g.first = first; g.phase = "play"; g.justDiscarded = null; g.last = null; g.drawn = [null, null];
  g.log.push(`${g.round}라운드 시작 — ${names[first]} 님부터`);
  return g;
}
const sortHand = h => h.slice().sort((a, b) => COLORS.indexOf(a.c) - COLORS.indexOf(b.c) || a.v - b.v);
const cardText = c => c.v ? `${CNAME[c.c]} ${c.v}` : `${CNAME[c.c]} 투자 카드`;
const EUL = { 0: "를", 2: "를", 3: "을", 4: "를", 5: "를", 6: "을", 7: "을", 8: "을", 9: "를", 10: "을" };
const cardEul = c => cardText(c) + EUL[c.v];

const game = {
  id: "lostcities",
  title: "로스트 시티",
  mark: `<div class="mark-lc">${COMPASS}</div>`,
  tagline: "다섯 곳의 잃어버린 도시로 탐험대를 보내세요. 출발은 신중하게, 숫자는 꼭 올라가는 순서로.",
  options: [{ id: "rounds", label: "라운드 수", def: 3, choices: [{ v: 1, label: "1라운드 (짧게)" }, { v: 3, label: "3라운드 (정식)" }] }],
  setup(players, opts) {
    const g = { rounds: +opts.rounds || 3, round: 0, totals: [0, 0], history: [], log: [], over: false };
    return deal(g, rnd(2), players.map(p => p.name));
  },
  apply(g, seat, a, env) {
    const N = env.names;
    if (a.type === "next") {
      if (g.phase !== "roundEnd" || g.over) return null;
      return deal(g, 1 - g.first, N);
    }
    if (seat !== g.turn) return null;
    const hand = g.hands[seat];
    if (a.type === "play" || a.type === "discard") {
      if (g.phase !== "play") return null;
      const i = hand.findIndex(c => c.id === a.id);
      if (i < 0) return null;
      const card = hand[i];
      if (a.type === "play") {
        if (!canPlay(g.exp[seat][card.c], card)) return null;
        hand.splice(i, 1); g.exp[seat][card.c].push(card);
        g.justDiscarded = null;
        g.last = { seat, kind: "play", card };
        g.log.push(`${N[seat]} 님이 ${CNAME[card.c]} 탐험에 ${cardEul(card)} 놓았어요`);
      } else {
        hand.splice(i, 1); g.discard[card.c].push(card);
        g.justDiscarded = card.c;
        g.last = { seat, kind: "discard", card };
        g.log.push(`${N[seat]} 님이 ${cardEul(card)} 버렸어요`);
      }
      g.phase = "draw";
      return g;
    }
    if (a.type === "draw") {
      if (g.phase !== "draw") return null;
      let card;
      if (a.from === "deck") {
        if (!g.deck.length) return null;
        card = g.deck.pop();
        g.last.drew = "deck";
        g.log.push(`${N[seat]} 님이 덱에서 한 장 가져갔어요 (남은 덱 ${g.deck.length}장)`);
      } else {
        const pile = g.discard[a.from];
        if (!pile || !pile.length || a.from === g.justDiscarded) return null;
        card = pile.pop();
        g.last.drew = a.from; g.last.drewCard = card;
        g.log.push(`${N[seat]} 님이 버린 더미에서 ${cardEul(card)} 가져갔어요`);
      }
      hand.push(card);
      g.drawn[seat] = card.id;
      g.justDiscarded = null;
      if (!g.deck.length) {
        const sc = [roundScore(g.exp[0]), roundScore(g.exp[1])];
        g.history.push({ round: g.round, per: [COLORS.map(c => expScore(g.exp[0][c])), COLORS.map(c => expScore(g.exp[1][c]))], sc });
        g.totals = [g.totals[0] + sc[0], g.totals[1] + sc[1]];
        g.phase = "roundEnd";
        g.log.push(`덱이 바닥나 ${g.round}라운드 끝 — ${N[0]} ${sc[0]}점, ${N[1]} ${sc[1]}점`);
        if (g.round >= g.rounds) g.over = true;
      } else { g.turn = 1 - seat; g.phase = "play"; }
      return g;
    }
    return null;
  },
  render(ctx) {
    const g = ctx.g, N = ctx.names;
    const me = ctx.me < 0 ? 0 : ctx.me, op = 1 - me, spect = ctx.me < 0;
    const myTurn = !spect && g.turn === me && g.phase !== "roundEnd";
    const sel = ctx.ui.sel != null ? g.hands[me].find(c => c.id === ctx.ui.sel) : null;
    if (ctx.ui.sel != null && !sel) ctx.ui.sel = null;
    const lastId = g.last && g.last.card ? g.last.card.id : -1;

    const strip = `<div class="lc-strip"><span>${g.round}/${g.rounds} 라운드</span>
      <span>덱 <b class="num">${g.deck.length}</b>장</span>
      <span>누적 ${esc(N[me])} <b class="num">${g.totals[me]}</b> : <b class="num">${g.totals[op]}</b> ${esc(N[op])}</span></div>`;

    const cols = (seat, top) => `<div class="lc-cols">${COLORS.map(c => {
      const col = g.exp[seat][c];
      const can = seat === me && myTurn && g.phase === "play" && sel && sel.c === c && canPlay(col, sel);
      const sc = expScore(col);
      const chips = col.map(x => chipHTML(x, x.id === lastId)).join("");
      const score = col.length ? `<div class="score ${sc < 0 ? "neg" : "pos"}">${sc > 0 ? "+" : ""}${sc}</div>` : `<div class="score" style="opacity:.35">·</div>`;
      return `<div class="lc-col c-${c} ${top ? "top" : ""} ${can ? "can" : ""}" ${can ? `data-a="col" data-c="${c}" role="button" aria-label="${CNAME[c]} 탐험에 놓기"` : ""}>
        ${top ? score + chips : `<div class="lbl">${CNAME[c]}</div>` + chips + score}</div>`;
    }).join("")}</div>`;

    const camp = `<div class="lc-camp">${COLORS.map(c => {
      const pile = g.discard[c];
      const top = pile[pile.length - 1];
      const canDraw = myTurn && g.phase === "draw" && pile.length && c !== g.justDiscarded;
      const canDiscard = myTurn && g.phase === "play" && sel && sel.c === c;
      const blocked = myTurn && g.phase === "draw" && c === g.justDiscarded;
      return `<button class="lc-pile c-${c} ${canDraw || canDiscard ? "can" : ""} ${blocked ? "blocked" : ""}" data-a="pile" data-c="${c}" ${canDraw || canDiscard ? "" : "disabled"} aria-label="${CNAME[c]} 버린 더미 ${pile.length}장">
        ${top ? cardHTML(top) : `<span class="slot">${ART[c]}</span>`}<span class="cnt">${pile.length ? pile.length + "장" : CNAME[c]}</span></button>`;
    }).join("")}
      <button class="lc-pile ${myTurn && g.phase === "draw" ? "can" : ""}" data-a="deck" ${myTurn && g.phase === "draw" ? "" : "disabled"} aria-label="덱에서 가져오기"><span class="lc-deck">${g.deck.length}</span><span class="cnt">덱</span></button></div>`;

    let say;
    if (g.phase === "roundEnd") say = "";
    else if (spect) say = `${esc(N[g.turn])} 님 차례`;
    else if (!myTurn) say = `${esc(N[op])} 님이 고민 중이에요…`;
    else if (g.phase === "play") say = sel ? `<em>${cardText(sel)}</em> — 탐험에 놓거나 같은 색 더미에 버리세요` : "손에서 카드 한 장을 고르세요";
    else say = `이제 한 장 가져오세요 — <em>덱</em>이나 버린 더미 맨 위 카드${g.justDiscarded ? ` (방금 버린 ${CNAME[g.justDiscarded]} 더미는 안 돼요)` : ""}`;

    const hand = spect ? "" : `<div class="lc-hand">${sortHand(g.hands[me]).map(c => `<button data-a="card" data-id="${c.id}" class="${ctx.ui.sel === c.id ? "sel" : ""} ${g.drawn[me] === c.id ? "drawn" : ""}" ${myTurn && g.phase === "play" ? "" : "disabled"}>${cardHTML(c)}</button>`).join("")}</div>`;
    const actions = myTurn && g.phase === "play" && sel ? `<div class="lc-actions">
      <button class="duo-btn primary" data-a="play" ${canPlay(g.exp[me][sel.c], sel) ? "" : "disabled"}><b>탐험에 놓기</b><span>${canPlay(g.exp[me][sel.c], sel) ? (g.exp[me][sel.c].length ? "탐험을 이어가요" : "새 탐험 출발 (−20점부터)") : sel.v ? "더 큰 숫자만 놓을 수 있어요" : "투자 카드는 숫자보다 먼저"}</span></button>
      <button class="duo-btn" data-a="discard"><b>버리기</b><span>${CNAME[sel.c]} 더미 위에 놓아요</span></button></div>` : "";

    let roundPanel = "";
    if (g.phase === "roundEnd") {
      const h = g.history[g.history.length - 1];
      roundPanel = `<div class="duo-panel lc-round"><h2>${h.round}라운드 정산</h2>
        <table class="duo-table"><thead><tr><th></th><th>${esc(N[0])}</th><th>${esc(N[1])}</th></tr></thead><tbody>
        ${COLORS.map((c, i) => `<tr class="c-${c}"><td><span class="lc-dot"></span> ${CNAME[c]}</td><td class="num">${h.per[0][i]}</td><td class="num">${h.per[1][i]}</td></tr>`).join("")}
        <tr><td><b>이번 라운드</b></td><td class="num"><b>${h.sc[0]}</b></td><td class="num"><b>${h.sc[1]}</b></td></tr>
        <tr><td>누적</td><td class="num">${g.totals[0]}</td><td class="num">${g.totals[1]}</td></tr></tbody></table>
        ${g.over ? finalLine(g, N) : ""}
        ${spect ? "" : g.over ? `<div class="duo-row"><button class="duo-btn primary" data-duo="again"><b>한 판 더</b><span>같은 둘이서 처음부터</span></button><button class="duo-btn" data-duo="lobby"><b>처음 화면</b><span>설정 바꾸기</span></button></div>`
          : `<div class="duo-row"><button class="duo-btn primary" data-a="next"><b>${g.round + 1}라운드 시작</b><span>${esc(N[1 - g.first])} 님부터 시작해요</span></button></div>`}</div>`;
    }

    return `<div class="lc-sec">${strip}</div>
      <section class="lc-sec" aria-label="상대 탐험대">
        <div class="lc-who"><b>${esc(N[op])}</b><span class="lc-backs">${g.hands[op].map(() => "<i></i>").join("")}</span>${g.turn === op && g.phase !== "roundEnd" ? `<span class="turn">차례</span>` : ""}</div>
        ${cols(op, true)}</section>
      <section aria-label="베이스캠프">${camp}</section>
      <section class="lc-sec" aria-label="내 탐험대">${cols(me, false)}
        <div class="lc-who"><b>${spect ? esc(N[me]) : "나 (" + esc(N[me]) + ")"}</b>${g.turn === me && g.phase !== "roundEnd" ? `<span class="turn">차례</span>` : ""}</div></section>
      ${roundPanel}
      <p class="lc-say">${say}</p>
      ${hand}${actions}`;
  },
  onClick(el, ctx) {
    const g = ctx.g, a = el.dataset.a;
    const me = ctx.me;
    if (a === "card") { const id = +el.dataset.id; ctx.ui.sel = ctx.ui.sel === id ? null : id; ctx.rerender(); return; }
    if (a === "next") { ctx.act({ type: "next" }); return; }
    if (a === "play" || a === "col") { if (ctx.ui.sel != null && ctx.act({ type: "play", id: ctx.ui.sel })) ctx.ui.sel = null; return; }
    if (a === "discard") { if (ctx.ui.sel != null && ctx.act({ type: "discard", id: ctx.ui.sel })) ctx.ui.sel = null; return; }
    if (a === "deck") { ctx.act({ type: "draw", from: "deck" }); return; }
    if (a === "pile") {
      const c = el.dataset.c;
      if (g.phase === "play") { const sel = g.hands[me].find(x => x.id === ctx.ui.sel); if (sel && sel.c === c && ctx.act({ type: "discard", id: sel.id })) ctx.ui.sel = null; }
      else ctx.act({ type: "draw", from: c });
    }
  },
  rules: `
  <p>둘이서 다섯 곳의 잃어버린 도시로 탐험대를 보내 점수를 겨루는 게임이에요. 탐험은 떠나는 순간 빚(−20점)을 지고 시작해서, 카드를 많이 쌓아야 이익이 나요.</p>
  <h3>카드</h3>
  <p>사막·바다·설산·밀림·화산 다섯 색. 색마다 숫자 2~10 한 장씩, 그리고 <b>투자 카드</b> 3장 — 모두 60장이에요. 각자 8장을 들고 시작해요.</p>
  <div class="rule-cards">${cardHTML({ c: "Y", v: 0 })}${cardHTML({ c: "B", v: 3 })}${cardHTML({ c: "W", v: 7 })}${cardHTML({ c: "G", v: 10 })}</div>
  <h3>내 차례 (두 단계)</h3>
  <ol>
    <li><b>카드 한 장 내기</b> — 둘 중 하나
      <ul><li><b>탐험에 놓기</b>: 내 쪽 같은 색 줄에 놓아요. 숫자는 <b>앞에 놓인 숫자보다 커야</b> 해요 (같은 숫자도 안 돼요). 투자 카드는 그 색에 숫자 카드를 놓기 <b>전에만</b> 놓을 수 있어요.</li>
      <li><b>버리기</b>: 가운데 같은 색 더미 위에 앞면으로 버려요.</li></ul></li>
    <li><b>카드 한 장 가져오기</b> — 덱 맨 위, 또는 아무 버린 더미의 맨 위 카드. 단, 방금 내가 버린 카드는 바로 다시 가져올 수 없어요.</li>
  </ol>
  <h3>라운드가 끝나는 때</h3>
  <p>덱의 마지막 카드를 누가 가져가는 순간 바로 끝나요. 덱 숫자를 잘 보고 버린 더미에서 가져오며 시간을 끄는 것도 작전이에요.</p>
  <h3>점수 계산 (탐험 하나마다)</h3>
  <ul>
    <li>출발하지 않은 탐험은 0점.</li>
    <li>출발한 탐험: <b>(숫자 합 − 20) × (투자 카드 수 + 1)</b>. 투자 1장이면 ×2, 2장 ×3, 3장 ×4. 손해도 그만큼 커져요.</li>
    <li>카드가 8장 이상이면 <b>+20점 보너스</b> (곱한 뒤에 더해요).</li>
  </ul>
  <p class="sub">예: 투자 1장 + 4, 6, 9 → (19 − 20) × 2 = −2점. 투자 없이 3, 5, 7, 8, 10 → 33 − 20 = +13점.</p>
  <h3>정식 게임</h3>
  <p>3라운드를 하고 점수를 더해 높은 사람이 이겨요. 라운드마다 먼저 시작하는 사람이 바뀌어요.</p>
  <h3>이 화면 보는 법</h3>
  <ul><li>손패를 누르면 선택돼요. 놓을 수 있는 탐험 줄과 버릴 더미가 테두리로 표시돼요. 줄이나 더미를 직접 눌러도 돼요.</li>
  <li>각 탐험 줄 아래 숫자는 지금 끝난다면 받을 점수예요.</li>
  <li>방금 가져온 카드에는 '새' 표시가 붙어요.</li></ul>`,
};
function finalLine(g, N) {
  const [a, b] = g.totals;
  const t = a === b ? `무승부! ${a} : ${b}` : `${esc(N[a > b ? 0 : 1])} 님 승리! ${Math.max(a, b)} : ${Math.min(a, b)}`;
  return `<p style="text-align:center;font-family:var(--f-display);font-size:22px;color:var(--accent);margin:0">${t}</p>`;
}
Duo(game);
})();
</script>
</body>
</html>
