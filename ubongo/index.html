<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>우봉고</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gowun+Dodum&display=swap">
<link rel="stylesheet" href="../shared/duo.css">
<style>
/* Layout: a savanna-sunset table; the puzzle card (holes to fill) on top, the pieces scattered below it, the sand timer and gem count above. */
:root {
  color-scheme: dark;
  --bg: #3b1733;
  --bg2: #4a1f40;
  --panel: rgba(255, 232, 196, .1);
  --line: rgba(255, 220, 170, .22);
  --fg: #fff1dc;
  --muted: #e7bfa0;
  --accent: #ffcf5a;
  --accent-fg: #3b1733;
  --danger: #ff6b6b;
  --ok: #7fe0a0;
  --sheet: #4a1f40;
  --scrim: rgba(25, 6, 20, .6);
  --f-display: "Do Hyeon", "Gowun Dodum", sans-serif;
  --f-body: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --sand: #f6e2b8;
  --hole: #3b1733;
}
body {
  background-color: var(--bg);
  background-image:
    radial-gradient(circle at 88% 38%, rgba(255, 214, 122, .28) 0 54px, transparent 55px),
    linear-gradient(180deg, #e9803a 0%, #b84d55 34%, #6b2550 62%, var(--bg) 100%);
  background-attachment: fixed;
}
.duo-title { color: var(--accent); font-size: 26px; }
.mark-u { width: 140px; height: 96px; }

.ub-top { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.ub-gems { display: flex; gap: 12px; font-size: 13px; color: var(--muted); }
.ub-gems b { color: var(--fg); font-family: var(--f-display); font-size: 20px; font-weight: 400; }
.ub-gems .g { display: inline-flex; align-items: center; gap: 4px; }
.ub-gems svg { width: 16px; }
.ub-round { margin-left: auto; font-size: 13px; color: var(--muted); }
.ub-timer { position: relative; height: 26px; border-radius: 999px; background: rgba(0, 0, 0, .25); border: 1px solid var(--line); overflow: hidden; }
.ub-timer i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, #ffcf5a, #ff9a3c); transition: width .2s linear; }
.ub-timer i.low { background: linear-gradient(90deg, #ff6b6b, #ff9a3c); }
.ub-timer span { position: relative; display: block; text-align: center; line-height: 26px; font-family: var(--f-display); font-size: 17px; color: #3b1733; mix-blend-mode: normal; }
.ub-status { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--muted); }
.ub-status b { color: var(--fg); font-weight: 400; }
.ub-status .done { color: var(--ok); }

.ub-stage { position: relative; width: 100%; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
.ub-card { position: absolute; border-radius: 14px; background: var(--sand); box-shadow: 0 10px 24px rgba(30, 5, 20, .45), inset 0 0 0 3px #e4c78f; }
.ub-hole { position: absolute; border-radius: 4px; background: var(--hole); box-shadow: inset 0 3px 6px rgba(0, 0, 0, .55); }
/* 조각의 네모 상자 전체가 아니라 실제 칸만 손가락을 받는다 (ㄱ자 조각의 빈 귀퉁이 아래 칸을 누를 수 있게) */
.ub-piece { position: absolute; touch-action: none; pointer-events: none; }
.ub-piece .sq { pointer-events: auto; cursor: grab; }
.ub-piece.drag { cursor: grabbing; z-index: 20; filter: drop-shadow(0 10px 10px rgba(0, 0, 0, .45)); }
.ub-piece.sel .sq { box-shadow: inset 0 0 0 2px #fff, inset 0 -3px 0 rgba(0,0,0,.25); }
.ub-piece .sq { position: absolute; border-radius: 4px; background: var(--pc); box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .25), inset 0 2px 0 rgba(255, 255, 255, .35); }
.ub-piece.placed .sq { box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .2), inset 0 2px 0 rgba(255, 255, 255, .3), 0 0 0 1px rgba(59, 23, 51, .5); }
.ub-tools { display: flex; gap: 8px; }
.ub-tools .duo-btn { flex: 1; }
.ub-say { margin: 0; text-align: center; font-size: 14px; min-height: 1.5em; text-wrap: balance; }
.ub-say em { font-style: normal; color: var(--accent); }
.ub-solved { animation: glow 1.2s ease-in-out 2; }
@keyframes glow { 50% { filter: brightness(1.25) drop-shadow(0 0 16px #ffcf5a); } }
.ub-hidden { display: grid; place-items: center; height: 220px; border-radius: 14px; border: 1px dashed var(--line); color: var(--muted); }
.rule-pieces { display: flex; gap: 10px; flex-wrap: wrap; }
.rule-pieces svg { width: 46px; height: 46px; }
</style>
</head>
<body>
<div class="duo" id="app"></div>
<div id="layer"></div>
<script src="../shared/duo.js"></script>
<script>
(() => {
"use strict";
const { esc, shuffle, rnd } = DuoUtil;

/* ───── pieces ───── */
const PIECES = {
  I3: { cells: [[0, 0], [0, 1], [0, 2]], color: "#e2483d" },
  L3: { cells: [[0, 0], [1, 0], [1, 1]], color: "#f5d547" },
  O4: { cells: [[0, 0], [0, 1], [1, 0], [1, 1]], color: "#3fb6d9" },
  I4: { cells: [[0, 0], [0, 1], [0, 2], [0, 3]], color: "#8bd450" },
  L4: { cells: [[0, 0], [1, 0], [2, 0], [2, 1]], color: "#f08a2c" },
  T4: { cells: [[0, 0], [0, 1], [0, 2], [1, 1]], color: "#b46ee0" },
  S4: { cells: [[0, 1], [0, 2], [1, 0], [1, 1]], color: "#ff7fb0" },
  P5: { cells: [[0, 0], [0, 1], [1, 0], [1, 1], [2, 0]], color: "#2f8f6f" },
  L5: { cells: [[0, 0], [1, 0], [2, 0], [3, 0], [3, 1]], color: "#4a6fe3" },
  U5: { cells: [[0, 0], [0, 2], [1, 0], [1, 1], [1, 2]], color: "#d9a441" },
};
const KEYS = Object.keys(PIECES);
const norm = cells => { const mr = Math.min(...cells.map(x => x[0])), mc = Math.min(...cells.map(x => x[1])); return cells.map(([r, c]) => [r - mr, c - mc]).sort((a, b) => a[0] - b[0] || a[1] - b[1]); };
const rot = cells => norm(cells.map(([r, c]) => [c, -r]));
const flip = cells => norm(cells.map(([r, c]) => [r, -c]));
const sig = cells => norm(cells).map(x => x.join(",")).join(";");
function orients(cells) {
  const out = new Map(); let a = norm(cells);
  for (let f = 0; f < 2; f++) { for (let i = 0; i < 4; i++) { out.set(sig(a), a); a = rot(a); } a = flip(a); }
  return [...out.values()];
}
const dims = cells => ({ h: Math.max(...cells.map(x => x[0])) + 1, w: Math.max(...cells.map(x => x[1])) + 1 });

function genPuzzle(k) {
  const maxW = k === 3 ? 5 : 6, maxH = k === 3 ? 4 : 5;
  for (let attempt = 0; attempt < 400; attempt++) {
    const keys = shuffle(KEYS.slice()).slice(0, k);
    const occ = new Map(); let ok = true;
    for (let i = 0; i < keys.length && ok; i++) {
      const os = orients(PIECES[keys[i]].cells); let placed = false;
      for (let t = 0; t < 80 && !placed; t++) {
        const o = os[rnd(os.length)];
        let dr = 0, dc = 0;
        if (i > 0) {
          const occList = [...occ.keys()].map(s => s.split(",").map(Number));
          const [ar, ac] = occList[rnd(occList.length)];
          const [pr, pc] = o[rnd(o.length)];
          const [er, ec] = [[1, 0], [-1, 0], [0, 1], [0, -1]][rnd(4)];
          dr = ar + er - pr; dc = ac + ec - pc;
        }
        const cells = o.map(([r, c]) => [r + dr, c + dc]);
        if (cells.some(([r, c]) => occ.has(r + "," + c))) continue;
        const all = [...occ.keys()].map(s => s.split(",").map(Number)).concat(cells);
        const rs = all.map(x => x[0]), cs = all.map(x => x[1]);
        if (Math.max(...rs) - Math.min(...rs) + 1 > maxH || Math.max(...cs) - Math.min(...cs) + 1 > maxW) continue;
        cells.forEach(([r, c]) => occ.set(r + "," + c, keys[i]));
        placed = true;
      }
      if (!placed) ok = false;
    }
    if (!ok) continue;
    const cells = norm([...occ.keys()].map(s => s.split(",").map(Number)));
    const d = dims(cells);
    if (d.w * d.h === cells.length) continue;            // 꽉 찬 직사각형은 너무 쉬워서 다시
    return { cells, pieces: keys, w: d.w, h: d.h };
  }
  return null;
}
function validLayout(puzzle, layout) {
  if (!Array.isArray(layout) || layout.length !== puzzle.pieces.length) return false;
  const want = new Set(puzzle.cells.map(x => x.join(","))), got = new Set();
  const left = puzzle.pieces.slice();
  for (const it of layout) {
    const i = left.indexOf(it.k); if (i < 0) return false; left.splice(i, 1);
    if (!orients(PIECES[it.k].cells).some(o => sig(o) === sig(it.cells))) return false;
    for (const [r, c] of it.cells) { const s = r + "," + c; if (!want.has(s) || got.has(s)) return false; got.add(s); }
  }
  return got.size === want.size;
}

const GEM = c => `<svg viewBox="0 0 20 18" aria-hidden="true"><path d="M5 1 H15 L19 6 L10 17 L1 6Z" fill="${c}"/><path d="M5 1 L10 6 L15 1 M1 6 H19 M10 6 V17" stroke="rgba(255,255,255,.45)" stroke-width="1" fill="none"/></svg>`;
const MARK = `<svg class="mark-u" viewBox="0 0 140 96" aria-hidden="true"><rect x="10" y="8" width="120" height="80" rx="12" fill="#f6e2b8"/>${[[0, 0, "#3fb6d9"], [0, 1, "#3fb6d9"], [1, 1, "#3fb6d9"], [1, 0, "#3fb6d9"], [0, 2, "#f5d547"], [1, 2, "#f5d547"], [1, 3, "#f5d547"], [2, 3, "#e2483d"], [2, 2, "#e2483d"], [2, 1, "#e2483d"]].map(([r, c, col]) => `<rect x="${32 + c * 19}" y="${18 + r * 19}" width="17" height="17" rx="3" fill="${col}"/>`).join("")}<rect x="32" y="56" width="17" height="17" rx="3" fill="#3b1733"/><rect x="108" y="18" width="17" height="17" rx="3" fill="#3b1733"/></svg>`;

const ROUND_MS = { 3: 60000, 4: 90000 };
function newRound(g) {
  g.round += 1;
  g.rid = (g.rid || 0) + 1;
  g.puzzle = genPuzzle(g.k);
  g.times = [null, null];
  g.phase = "solving";
  g.award = null;
  return g;
}
function score(g, N) {
  const solved = [0, 1].filter(s => g.times[s] >= 0).sort((a, b) => g.times[a] - g.times[b]);
  const award = [0, 0];
  if (solved[0] != null) award[solved[0]] = 3;
  if (solved[1] != null) award[solved[1]] = 1;
  g.gems = [g.gems[0] + award[0], g.gems[1] + award[1]];
  g.award = award;
  g.history.push({ round: g.round, times: g.times.slice(), award });
  g.log.push(`${g.round}번째 퍼즐 — ${[0, 1].map(s => `${N[s]} ${g.times[s] >= 0 ? (g.times[s] / 1000).toFixed(1) + "초" : "실패"}`).join(", ")}`);
  g.phase = "scored";
  if (g.round >= g.rounds) g.over = true;
}
const secs = ms => (ms / 1000).toFixed(1);

const game = {
  id: "ubongo",
  title: "우봉고",
  mark: MARK,
  tagline: "같은 퍼즐을 동시에 풀어요. 조각을 돌리고 뒤집어 구멍을 먼저 채우는 사람이 보석을 더 가져가요.",
  options: [
    { id: "k", label: "조각 수", def: 3, choices: [{ v: 3, label: "3조각 (60초)" }, { v: 4, label: "4조각 (90초)" }] },
    { id: "rounds", label: "퍼즐 수", def: 6, choices: [{ v: 4, label: "4판" }, { v: 6, label: "6판" }, { v: 9, label: "9판" }] },
  ],
  setup(players, opts, env) {
    const g = { k: +opts.k || 3, rounds: +opts.rounds || 6, round: 0, gems: [0, 0], history: [], log: [], over: false };
    return newRound(g);
  },
  apply(g, seat, a, env) {
    const N = env.names;
    if (a.type === "solved" || a.type === "fail") {
      if (g.phase !== "solving" || g.times[seat] != null || a.rid !== g.rid) return null;
      if (a.type === "solved") {
        if (!validLayout(g.puzzle, a.layout) || !(a.ms > 0)) return null;
        g.times[seat] = Math.round(a.ms);
      } else g.times[seat] = -1;
      if (g.times[0] != null && g.times[1] != null) score(g, N);
      return g;
    }
    if (a.type === "next") {
      if (g.phase !== "scored" || g.over) return null;
      return newRound(g);
    }
    return null;
  },
  result(g, ctx) {
    if (!g.over || g.phase !== "scored") return null;
    const [a, b] = g.gems, N = ctx.names;
    const title = a === b ? "무승부!" : `${esc(N[a > b ? 0 : 1])} 님 승리!`;
    return { title, html: `<table class="duo-table"><thead><tr><th>퍼즐</th><th>${esc(N[0])}</th><th>${esc(N[1])}</th></tr></thead><tbody>
      ${g.history.map(h => `<tr><td>${h.round}</td>${[0, 1].map(s => `<td class="num">${h.times[s] >= 0 ? secs(h.times[s]) + "초" : "—"} ${h.award[s] ? `(+${h.award[s]})` : ""}</td>`).join("")}</tr>`).join("")}
      <tr><td><b>보석</b></td><td class="num"><b>${a}</b></td><td class="num"><b>${b}</b></td></tr></tbody></table>` };
  },
  render(ctx) {
    const g = ctx.g, N = ctx.names;
    const me = ctx.me < 0 ? 0 : ctx.me, op = 1 - me, spect = ctx.me < 0;
    const solving = g.phase === "solving" && !spect && g.times[me] == null;
    const gems = `<div class="ub-gems">${[me, op].map((s, i) => `<span class="g">${GEM(i ? "#3fb6d9" : "#ffcf5a")} ${esc(N[s])} <b>${g.gems[s]}</b></span>`).join("")}</div>`;
    const top = `<div class="ub-top">${gems}<span class="ub-round">${g.round}/${g.rounds}번째 퍼즐 · ${g.k}조각</span></div>`;

    let mid = "";
    if (g.phase === "solving") {
      const oppTxt = g.times[op] == null ? "푸는 중…" : g.times[op] >= 0 ? `<span class="done">${secs(g.times[op])}초에 완성!</span>` : "시간 초과";
      const myTxt = g.times[me] == null ? "" : g.times[me] >= 0 ? `<span class="done">${secs(g.times[me])}초에 완성!</span>` : "시간 초과";
      mid = `<div class="ub-timer" id="ub-timer"><i style="width:100%"></i><span>${solving ? "" : "—"}</span></div>
        ${myTxt || oppTxt ? `<div class="ub-status"><span>${myTxt ? `나 <b>${myTxt}</b>` : ""}</span>${oppTxt ? `<span>${esc(N[op])} <b>${oppTxt}</b></span>` : ""}</div>` : ""}`;
    }
    let body;
    if (g.phase === "scored") {
      const h = g.history[g.history.length - 1];
      body = `<div class="duo-panel"><h2>${h.round}번째 퍼즐 결과</h2>
        <table class="duo-table"><tbody>${[0, 1].map(s => `<tr><td>${esc(N[s])}</td><td class="num">${h.times[s] >= 0 ? secs(h.times[s]) + "초" : "못 풀었어요"}</td><td class="num">${h.award[s] ? `보석 +${h.award[s]}` : ""}</td></tr>`).join("")}</tbody></table>
        ${g.over || spect ? "" : `<div class="duo-row"><button class="duo-btn primary" data-a="next"><b>다음 퍼즐</b><span>누르면 둘 다 바로 시작해요</span></button></div>`}</div>
        <div class="ub-stage" id="ub-stage" data-show="solution"></div>`;
    } else if (solving) {
      body = `<div class="ub-stage" id="ub-stage"></div>
        <div class="ub-tools"><button class="duo-btn" data-a="rot"><b>돌리기 ↻</b><span>조각을 톡 눌러도 돌아가요</span></button><button class="duo-btn" data-a="flip"><b>뒤집기 ⇋</b><span>마지막에 만진 조각</span></button></div>
        <p class="ub-say">조각을 끌어다 구멍에 맞춰 놓으세요. 놓인 조각을 끌어내면 빠져요.</p>`;
    } else if (!spect && g.times[me] != null) {
      body = `<div class="ub-stage" id="ub-stage" data-show="solution"></div><p class="ub-say">${g.times[me] >= 0 ? "완성!" : "시간이 다 됐어요."} ${esc(N[op])} 님이 끝나길 기다리는 중…</p>`;
    } else {
      body = `<div class="ub-hidden">두 사람이 퍼즐을 푸는 중이에요</div>`;
    }
    return top + mid + body;
  },
  mounted(root, ctx) {
    const g = ctx.g, ui = ctx.ui;
    clearInterval(ui.timerId);
    const stage = root.querySelector("#ub-stage");
    const me = ctx.me < 0 ? 0 : ctx.me;
    const ukey = g.rid;
    if (ui.key !== ukey) {
      ui.key = ukey; ui.sel = 0; ui.done = false; ui.sent = false; ui.start = null; ui.drag = null;
      ui.pieces = g.puzzle.pieces.map(k => ({ k, o: norm(PIECES[k].cells), at: null }));
    }
    if (stage && stage.dataset.show === "solution") { drawStage(stage, ctx, true); return; }
    if (!stage) return;
    drawStage(stage, ctx, false);
    if (ui.start == null) ui.start = performance.now();
    const limit = ROUND_MS[g.k];
    const bar = root.querySelector("#ub-timer i"), txt = root.querySelector("#ub-timer span");
    const tick = () => {
      if (ui.done) return;
      const left = Math.max(0, limit - (performance.now() - ui.start));
      if (bar) { bar.style.width = (left / limit * 100) + "%"; bar.classList.toggle("low", left < 10000); }
      if (txt) txt.textContent = Math.ceil(left / 1000) + "초";
      if (left <= 0 && !ui.sent) { ui.sent = true; clearInterval(ui.timerId); ctx.toast("시간이 다 됐어요!"); ctx.act({ type: "fail", rid: g.rid }); }
    };
    tick(); ui.timerId = setInterval(tick, 200);
  },
  onClick(el, ctx) {
    const a = el.dataset.a, ui = ctx.ui;
    if (a === "next") ctx.act({ type: "next" });
    else if (a === "rot" || a === "flip") {
      const p = ui.pieces && ui.pieces[ui.sel];
      if (!p || ui.done) return;
      p.o = a === "rot" ? rot(p.o) : flip(p.o); p.at = null;
      const st = document.getElementById("ub-stage"); if (st) drawStage(st, ctx, false);
    }
  },
  rules: `
  <p>우봉고는 누가 더 빨리 퍼즐을 푸는지 겨루는 게임이에요. 퍼즐 카드의 구멍을 주어진 조각으로 빈틈없이 채우면 완성이에요.</p>
  <h3>한 판</h3>
  <ol>
    <li>둘에게 <b>같은 퍼즐</b>과 같은 조각이 주어지고, 모래시계가 돌아가기 시작해요.</li>
    <li>조각을 <b>돌리고 뒤집어</b> 구멍에 맞춰 놓아요. 조각은 모두 써야 하고, 겹치거나 구멍 밖으로 나가면 안 돼요.</li>
    <li>먼저 완성한 사람은 <b>보석 3개</b>, 시간 안에 늦게라도 완성한 사람은 <b>보석 1개</b>를 받아요.</li>
  </ol>
  <h3>게임 끝</h3>
  <p>정한 수의 퍼즐을 다 풀면 보석이 많은 사람이 이겨요.</p>
  <h3>조각 모양</h3>
  <div class="rule-pieces">${KEYS.map(k => pieceSVG(k)).join("")}</div>
  <h3>조작</h3>
  <ul><li>조각을 끌어서 구멍 위에 놓으면 칸에 딱 맞게 붙어요. 맞지 않으면 원래 자리로 돌아가요. 손가락으로 끌 때는 조각이 손가락 조금 위에 떠서 따라와요.</li>
  <li>조각을 톡 누르면 오른쪽으로 90° 돌아가요. "뒤집기"로 좌우를 뒤집어요.</li>
  <li>놓인 조각을 끌어내면 다시 뺄 수 있어요.</li></ul>`,
};
function pieceSVG(k) {
  const c = PIECES[k].cells, d = dims(c), s = 40 / Math.max(d.w, d.h);
  return `<svg viewBox="0 0 46 46">${c.map(([r, cc]) => `<rect x="${3 + cc * s}" y="${3 + r * s}" width="${s - 2}" height="${s - 2}" rx="2" fill="${PIECES[k].color}"/>`).join("")}</svg>`;
}

/* ───── the puzzle stage (drag & drop) ───── */
function drawStage(stage, ctx, solution) {
  const g = ctx.g, ui = ctx.ui, P = g.puzzle;
  const W = stage.clientWidth || 360;
  const cs = Math.floor(Math.min(46, (W - 24) / Math.max(P.w + 1, 7)));
  const pad = Math.round(cs * .5);
  const cardW = P.w * cs + pad * 2, cardH = P.h * cs + pad * 2;
  const cardX = Math.round((W - cardW) / 2), cardY = 4;
  const bx = cardX + pad, by = cardY + pad;                   // board origin (top-left of cell 0,0)
  // tray layout
  const trayY = cardY + cardH + Math.round(cs * .8);
  let x = 6, y = trayY, rowH = 0;
  const pos = ui.pieces.map(p => {
    if (p.at) return { x: bx + p.at[1] * cs, y: by + p.at[0] * cs };
    const d = dims(p.o), w = d.w * cs, h = d.h * cs;
    if (x + w > W - 6) { x = 6; y += rowH + Math.round(cs * .5); rowH = 0; }
    const out = { x, y }; x += w + Math.round(cs * .6); rowH = Math.max(rowH, h); return out;
  });
  stage.style.height = (solution ? cardY + cardH + 8 : y + rowH + 10) + "px";
  const holes = P.cells.map(([r, c]) => `<span class="ub-hole" style="left:${bx + c * cs + 1}px;top:${by + r * cs + 1}px;width:${cs - 2}px;height:${cs - 2}px"></span>`).join("");
  const pieces = ui.pieces.map((p, i) => {
    if (solution && !p.at) return "";
    const sq = p.o.map(([r, c]) => `<span class="sq" style="left:${c * cs + 1}px;top:${r * cs + 1}px;width:${cs - 2}px;height:${cs - 2}px"></span>`).join("");
    const d = dims(p.o);
    const style = `--pc:${PIECES[p.k].color};left:${pos[i].x}px;top:${pos[i].y}px;width:${d.w * cs}px;height:${d.h * cs}px${solution ? ";pointer-events:none" : ""}`;
    return `<div class="ub-piece ${p.at ? "placed" : ""} ${!solution && ui.sel === i ? "sel" : ""}" data-i="${i}" style="${style}" aria-label="조각 ${i + 1}">${sq}</div>`;
  }).join("");
  stage.innerHTML = `<div class="ub-card ${ui.done ? "ub-solved" : ""}" style="left:${cardX}px;top:${cardY}px;width:${cardW}px;height:${cardH}px"></div>${holes}${pieces}`;
  stage._geo = { bx, by, cs };
  if (solution) return;
  wireStage(stage, ctx);
}

/* 끌기: 아이폰 사파리는 손가락 움직임을 스크롤로 가져가 버리면 pointercancel을 보내서
   끌던 조각이 튕겨 나간다. 조각을 만지는 순간 touchstart/touchmove를 막아 스크롤이
   시작되지 않게 하고, 움직임은 window에서 받는다. */
let curStage = null;                  // 지금 화면에 있는 판 (프레임워크가 다시 그리면 바뀐다)
function wireStage(stage, ctx) {
  stage._ctx = ctx; curStage = stage;
  if (!windowWired) { windowWired = true; window.addEventListener("pointermove", onMove, { passive: true }); window.addEventListener("pointerup", onEnd); window.addEventListener("pointercancel", onEnd); }
  if (stage._wired) return;
  stage._wired = true;
  const blockTouch = e => { if (e.target.closest && e.target.closest(".ub-piece")) e.preventDefault(); };
  stage.addEventListener("touchstart", blockTouch, { passive: false });
  stage.addEventListener("touchmove", e => { if (stage._ctx.ui.drag) e.preventDefault(); }, { passive: false });
  stage.addEventListener("gesturestart", e => e.preventDefault());
  stage.addEventListener("contextmenu", e => { if (e.target.closest(".ub-piece")) e.preventDefault(); });
  stage.addEventListener("pointerdown", ev => {
    const ctx = stage._ctx, ui = ctx.ui;
    const el = ev.target.closest(".ub-piece");
    if (!el || ui.done || ui.drag) return;
    ev.preventDefault();
    const i = +el.dataset.i;
    const lift = ev.pointerType === "touch" ? Math.round(stage._geo.cs * .9) : 0;   // 손가락에 가리지 않게
    ui.drag = { stage, id: ev.pointerId, i, el, x0: ev.clientX, y0: ev.clientY, ox: el.offsetLeft, oy: el.offsetTop, lift, moved: false, t0: performance.now() };
    ui.sel = i;
    stage.querySelectorAll(".ub-piece").forEach(n => n.classList.toggle("sel", n === el));
  });
}
let windowWired = false;
function onMove(ev) {
    const stage = curStage; if (!stage) return;
    const ui = stage._ctx.ui, d = ui.drag;
    if (!d || ev.pointerId !== d.id) return;
    const dx = ev.clientX - d.x0, dy = ev.clientY - d.y0;
    if (!d.moved && Math.hypot(dx, dy) > 8) { d.moved = true; d.el.classList.add("drag"); }
    if (d.moved) { d.el.style.left = (d.ox + dx) + "px"; d.el.style.top = (d.oy + dy - d.lift) + "px"; }
}
function onEnd(ev) {
    const stage = curStage; if (!stage) return;
    const ctx = stage._ctx, ui = ctx.ui, d = ui.drag;
    if (!d || ev.pointerId !== d.id) return;
    ui.drag = null;
    const p = ui.pieces[d.i];
    if (d.stage !== stage || !d.el.isConnected) { drawStage(stage, ctx, false); return; }   // 끄는 사이 화면이 새로 그려졌으면 원래대로
    if (!d.moved) {
      if (ev.type === "pointerup" && performance.now() - d.t0 < 500) { p.o = rot(p.o); p.at = null; }
      drawStage(stage, ctx, false); ctx.flush(); return;
    }
    const { bx, by, cs } = stage._geo;
    const c0 = Math.round((d.el.offsetLeft - bx) / cs), r0 = Math.round((d.el.offsetTop - by) / cs);
    const want = new Set(ctx.g.puzzle.cells.map(x => x.join(",")));
    const others = new Set();
    ui.pieces.forEach((q, j) => { if (j !== d.i && q.at) q.o.forEach(([r, c]) => others.add((r + q.at[0]) + "," + (c + q.at[1]))); });
    const fits = p.o.every(([r, c]) => { const k = (r + r0) + "," + (c + c0); return want.has(k) && !others.has(k); });
    p.at = fits ? [r0, c0] : null;
    drawStage(stage, ctx, false);
    if (fits && ui.pieces.every(q => q.at)) finish(ctx);
    ctx.flush();                          // 끄는 동안 미뤄 둔 화면 갱신(상대 진행 상황 등)
}
function finish(ctx) {
  const ui = ctx.ui, g = ctx.g;
  if (ui.done) return;
  ui.done = true; ui.sent = true; clearInterval(ui.timerId);
  const ms = performance.now() - ui.start;
  const layout = ui.pieces.map(p => ({ k: p.k, cells: p.o.map(([r, c]) => [r + p.at[0], c + p.at[1]]) }));
  ctx.toast(`완성! ${secs(ms)}초`);
  const st = document.getElementById("ub-stage"); if (st) st.querySelector(".ub-card").classList.add("ub-solved");
  setTimeout(() => ctx.act({ type: "solved", rid: g.rid, ms, layout }), 500);
}
// 아이폰은 스크롤로 주소창이 접힐 때도 resize가 와서, 폭이 바뀐 경우에만 다시 그린다
let lastW = 0;
addEventListener("resize", () => {
  const st = document.getElementById("ub-stage");
  if (!st || !window.__ubCtx || window.__ubCtx.ui.drag || st.clientWidth === lastW) return;
  lastW = st.clientWidth; drawStage(st, window.__ubCtx, st.dataset.show === "solution");
});
game.holdRender = () => !!(curStage && curStage.isConnected && curStage._ctx.ui.drag);
const _mounted = game.mounted;
game.mounted = (root, ctx) => { window.__ubCtx = ctx; _mounted(root, ctx); };
Duo(game);
})();
</script>
</body>
</html>
