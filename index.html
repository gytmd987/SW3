<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>둘이서 게임방</title>
<script>
  // 예전 하나비 초대 링크(…/SW3/?r=코드)는 하나비로 보낸다
  (function () { var r = new URLSearchParams(location.search).get("r"); if (r) location.replace("hanabi/?r=" + encodeURIComponent(r)); })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&family=Yuji+Syuku&family=Cinzel:wght@800&family=Lilita+One&family=Jua&display=swap">
<style>
/* Layout: a game shelf on a walnut table — each tile is a little box lid in that game's own colors. */
:root {
  color-scheme: dark;
  --wood: #241912;
  --wood-2: #33241a;
  --ink: #f3eadc;
  --muted: #b9a893;
  --line: rgba(243, 234, 220, .14);
  --brass: #d9a95b;
  --f-head: "Gowun Batang", "Nanum Myeongjo", serif;
  --f-body: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}
html, body { min-height: 100%; }
body {
  margin: 0; color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5;
  background-color: var(--wood);
  background-image:
    repeating-linear-gradient(92deg, rgba(255, 255, 255, .018) 0 2px, transparent 2px 9px),
    repeating-linear-gradient(88deg, rgba(0, 0, 0, .12) 0 1px, transparent 1px 23px),
    radial-gradient(120% 70% at 50% 0%, var(--wood-2), var(--wood));
  background-attachment: fixed;
}
.wrap { max-width: 920px; margin: 0 auto; padding-inline: 16px; padding-block: 28px 40px; display: flex; flex-direction: column; gap: 22px; }
header { display: flex; flex-direction: column; gap: 6px; }
h1 { margin: 0; font-family: var(--f-head); font-weight: 700; font-size: clamp(30px, 7vw, 44px); letter-spacing: -.01em; text-wrap: balance; }
h1 span { color: var(--brass); }
header p { margin: 0; color: var(--muted); max-width: 46ch; }
.shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
.tile { display: flex; flex-direction: column; border-radius: 16px; overflow: hidden; text-decoration: none; color: var(--ink); background: #1a120d; border: 1px solid var(--line); box-shadow: 0 10px 24px rgba(0, 0, 0, .35); transition: transform .18s ease, box-shadow .18s ease; min-width: 0; }
a.tile:hover, a.tile:focus-visible { transform: translateY(-4px); box-shadow: 0 16px 30px rgba(0, 0, 0, .45); }
a.tile:focus-visible { outline: 2px solid var(--brass); outline-offset: 3px; }
.lid { position: relative; aspect-ratio: 16 / 9; display: grid; place-items: center; overflow: hidden; }
.lid svg { width: 100%; height: 100%; display: block; }
.body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 4px; }
.name { font-family: var(--f-head); font-size: 20px; font-weight: 700; display: flex; align-items: baseline; gap: 8px; }
.name small { font-family: var(--f-body); font-size: 12px; font-weight: 400; color: var(--muted); }
.meta { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { font-size: 11.5px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.chip.coop { border-color: rgba(233, 181, 79, .5); color: #e9c27a; }
.desc { margin: 0; font-size: 13.5px; color: #d8cbb8; }
.tile.soon { opacity: .55; }
.tile.soon .lid::after { content: "곧 열려요"; position: absolute; right: 10px; top: 10px; font-size: 12px; padding: 2px 10px; border-radius: 999px; background: rgba(0, 0, 0, .55); border: 1px solid var(--line); }
footer { color: var(--muted); font-size: 12.5px; display: flex; flex-direction: column; gap: 4px; border-top: 1px solid var(--line); padding-top: 14px; }
footer b { color: var(--ink); font-weight: 400; }
@media (prefers-reduced-motion: reduce) { .tile { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>둘이서 <span>게임방</span></h1>
    <p>둘이 하기 좋은 보드게임 모음이에요. 각자 폰으로 방 코드를 주고받아 하거나, 폰 하나로 번갈아 할 수 있어요.</p>
  </header>
  <main class="shelf" id="shelf"></main>
  <footer>
    <span><b>각자 폰으로</b> 하려면: 게임에서 "방 만들기" → 링크 복사 → 상대에게 보내기.</span>
    <span>규칙은 게임마다 "규칙" 버튼에 있어요.</span>
  </footer>
</div>
<script>
const GAMES = [
  { href: "hanabi/", name: "하나비", sub: "花火", time: "25분", kind: "협력", coop: true,
    desc: "내 카드만 안 보여요. 힌트만으로 둘이 함께 불꽃놀이를 완성해요.",
    lid: `<svg viewBox="0 0 160 90"><defs><radialGradient id="hn" cx="50%" cy="20%" r="90%"><stop offset="0" stop-color="#1c2452"/><stop offset="1" stop-color="#090c1f"/></radialGradient></defs><rect width="160" height="90" fill="url(#hn)"/>${burst(44, 30, 16, "#ff4d5e")}${burst(118, 24, 13, "#4fa6ff")}${burst(90, 46, 9, "#ffd23f")}<text x="80" y="76" text-anchor="middle" font-family="Yuji Syuku, serif" font-size="26" fill="#e9b54f">花火</text></svg>` },
  { href: "lostcities/", name: "로스트 시티", sub: "Lost Cities", time: "20분", kind: "대결",
    desc: "다섯 곳으로 탐험을 떠나요. 숫자는 올라가는 순서로만, 출발은 신중하게.",
    lid: `<svg viewBox="0 0 160 90"><rect width="160" height="90" fill="#e6dabd"/><g fill="none" stroke="rgba(110,78,34,.18)"><circle cx="30" cy="20" r="14"/><circle cx="30" cy="20" r="24"/><circle cx="30" cy="20" r="34"/><circle cx="140" cy="76" r="16"/><circle cx="140" cy="76" r="28"/></g>${["#e0a12c","#2f7db3","#b9c7d4","#4c9647","#d0472e"].map((c, i) => `<rect x="${22 + i * 24}" y="${30 - (i % 2) * 6}" width="20" height="30" rx="3" fill="${c}" stroke="#f6efdd" stroke-width="1.5"/>`).join("")}<text x="80" y="80" text-anchor="middle" font-family="Cinzel, serif" font-weight="800" font-size="12" letter-spacing="2" fill="#1e5a57">LOST CITIES</text></svg>` },
  { href: "6nimmt/", name: "젝스님트", sub: "6 nimmt!", time: "15분", kind: "대결",
    desc: "동시에 카드를 내고 줄에 붙여요. 여섯 번째 칸에 놓는 사람이 소 떼를 떠안아요.",
    lid: `<svg viewBox="0 0 160 90"><rect width="160" height="90" fill="#f4bf3a"/><g opacity=".25" fill="#fff">${Array.from({ length: 40 }, (_, i) => `<circle cx="${(i % 10) * 17 + 6}" cy="${Math.floor(i / 10) * 24 + 8}" r="2"/>`).join("")}</g><path fill="#4b2a7a" d="M56 26c4 9 11 12 17 12l-3 6c-9-1-16-9-14-18zm48 0c-4 9-11 12-17 12l3 6c9-1 16-9 14-18z"/><ellipse cx="80" cy="47" rx="17" ry="19" fill="#4b2a7a"/><ellipse cx="80" cy="58" rx="11.5" ry="8.5" fill="#fff7df"/><circle cx="73" cy="43" r="3" fill="#fff7df"/><circle cx="87" cy="43" r="3" fill="#fff7df"/><text x="122" y="70" font-family="Lilita One, sans-serif" font-size="30" fill="#d23a3a">6</text><text x="22" y="70" font-family="Lilita One, sans-serif" font-size="22" fill="#2b7bcc">55</text></svg>` },
  { href: "quoridor/", name: "쿼리도", sub: "Quoridor", time: "15분", kind: "대결", soon: true,
    desc: "말을 한 칸씩 움직이거나 벽을 세워 길을 막아요. 먼저 건너편에 닿으면 승리.",
    lid: `<svg viewBox="0 0 160 90"><rect width="160" height="90" fill="#3a2516"/>${Array.from({ length: 45 }, (_, i) => `<rect x="${35 + (i % 9) * 10}" y="${3 + Math.floor(i / 9) * 17}" width="8" height="15" rx="1" fill="#6b4a2f"/>`).join("")}<rect x="54" y="35" width="28" height="3" rx="1" fill="#e8c88f"/><rect x="92" y="18" width="3" height="32" rx="1" fill="#e8c88f"/><circle cx="79" cy="79" r="5" fill="#f2d16b"/><circle cx="79" cy="11" r="5" fill="#2b2b2b" stroke="#f3eadc"/></svg>` },
  { href: "ubongo/", name: "우봉고", sub: "Ubongo", time: "15분", kind: "대결", soon: true,
    desc: "같은 퍼즐을 동시에 풀어요. 조각을 돌려 빈칸을 먼저 채우는 사람이 보석을 가져가요.",
    lid: `<svg viewBox="0 0 160 90"><defs><linearGradient id="ub" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f28c38"/><stop offset="1" stop-color="#8e3b6b"/></linearGradient></defs><rect width="160" height="90" fill="url(#ub)"/><circle cx="120" cy="30" r="14" fill="#ffd27a"/><path d="M0 70 Q40 60 80 68 T160 64 V90 H0Z" fill="#4a2340"/><g stroke="#2a1426" stroke-width="1.5"><rect x="40" y="28" width="12" height="12" fill="#3fb6d9"/><rect x="52" y="28" width="12" height="12" fill="#3fb6d9"/><rect x="52" y="40" width="12" height="12" fill="#3fb6d9"/><rect x="64" y="40" width="12" height="12" fill="#f5d547"/><rect x="76" y="40" width="12" height="12" fill="#f5d547"/><rect x="76" y="52" width="12" height="12" fill="#f5d547"/><rect x="40" y="40" width="12" height="12" fill="#e2483d"/><rect x="40" y="52" width="12" height="12" fill="#e2483d"/></g></svg>` },
  { href: "splendor-duel/", name: "스플렌더 대결", sub: "Splendor Duel", time: "30분", kind: "대결", soon: true,
    desc: "보석 토큰을 모아 카드를 사고 왕관과 명성을 쌓아요. 둘만을 위한 스플렌더.",
    lid: `<svg viewBox="0 0 160 90"><rect width="160" height="90" fill="#16222e"/>${[["#f4f1ea", 34], ["#2f6fd6", 58], ["#2fa86b", 82], ["#d6413a", 106], ["#3a3a46", 130]].map(([c, x]) => `<g transform="translate(${x} 40)"><path d="M0 -14 L12 -4 L7 12 L-7 12 L-12 -4Z" fill="${c}" stroke="#d9b45a" stroke-width="1.2"/><path d="M0 -14 L4 -4 L0 12 L-4 -4Z" fill="#fff" opacity=".25"/></g>`).join("")}<path d="M66 72 L72 64 L80 70 L88 64 L94 72 Z" fill="#d9b45a"/></svg>` },
];
function burst(x, y, r, c) {
  let s = ""; for (let i = 0; i < 14; i++) { const a = i / 14 * Math.PI * 2; s += `<line x1="${x + Math.cos(a) * r * .35}" y1="${y + Math.sin(a) * r * .35}" x2="${x + Math.cos(a) * r}" y2="${y + Math.sin(a) * r}" stroke="${c}" stroke-width="1.4" stroke-linecap="round"/><circle cx="${x + Math.cos(a) * r}" cy="${y + Math.sin(a) * r}" r="1.3" fill="${c}"/>`; }
  return s;
}
document.getElementById("shelf").innerHTML = GAMES.map(g => {
  const inner = `<div class="lid">${g.lid}</div><div class="body"><div class="name">${g.name}<small>${g.sub}</small></div>
    <div class="meta"><span class="chip">2인</span><span class="chip">${g.time}</span><span class="chip ${g.coop ? "coop" : ""}">${g.kind}</span></div>
    <p class="desc">${g.desc}</p></div>`;
  return g.soon ? `<div class="tile soon" aria-disabled="true">${inner}</div>` : `<a class="tile" href="${g.href}">${inner}</a>`;
}).join("");
</script>
</body>
</html>
