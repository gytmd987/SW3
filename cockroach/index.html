<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>바퀴벌레 포커</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dokdo&family=Gowun+Dodum&display=swap">
<link rel="stylesheet" href="../shared/duo.css">
<style>
/* Layout: a grimy checkered kitchen floor — the rival's face-up critters on top, the card being bluffed in the middle, your critters and hand below. */
:root {
  color-scheme: dark;
  --bg: #1f2318;
  --bg2: #2a2f20;
  --panel: rgba(240, 230, 170, .07);
  --line: rgba(232, 197, 71, .25);
  --fg: #f1ead0;
  --muted: #b8b08a;
  --accent: #e8c547;
  --accent-fg: #1f2318;
  --danger: #ff6b5b;
  --ok: #9be07a;
  --sheet: #2a2f20;
  --scrim: rgba(10, 12, 6, .65);
  --f-display: "Dokdo", "Gowun Dodum", cursive;
  --f-body: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}
body {
  background-color: var(--bg);
  background-image:
    radial-gradient(120% 80% at 50% 40%, transparent 40%, rgba(0, 0, 0, .55)),
    conic-gradient(#262b1d 25%, #1c2016 0 50%, #262b1d 0 75%, #1c2016 0);
  background-size: 100% 100%, 56px 56px;
  background-attachment: fixed;
}
.duo-title { font-size: 30px; color: var(--accent); }
.duo-hero h1, .duo-panel h2, .duo-sheet h2 { letter-spacing: .02em; }
.duo-hero h1 { font-size: 40px; }
.mark-cr { width: 120px; height: 120px; }

.cr-ani { --a: #777; }
.a0 { --a: #8a5a2b; } .a1 { --a: #78838f; } .a2 { --a: #5d4b80; } .a3 { --a: #3d7380; }
.a4 { --a: #5b8a37; } .a5 { --a: #c27b2e; } .a6 { --a: #45464f; } .a7 { --a: #8b9a36; }

.cr-card { position: relative; width: 100%; aspect-ratio: 5 / 7; border-radius: 10px; background: radial-gradient(circle at 50% 40%, rgba(255,255,255,.22), transparent 60%), var(--a); box-shadow: inset 0 0 0 3px rgba(255, 245, 210, .85), 0 4px 10px rgba(0,0,0,.45); display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; }
.cr-card svg { width: 78%; }
.cr-card .nm { font-family: var(--f-display); font-size: clamp(16px, 5vw, 26px); color: #fff8dc; text-shadow: 0 2px 0 rgba(0,0,0,.35); line-height: 1; }
.cr-back { width: 100%; aspect-ratio: 5 / 7; border-radius: 10px; background: repeating-linear-gradient(45deg, #3a3f2a 0 6px, #30351f 6px 12px); box-shadow: inset 0 0 0 3px var(--accent), 0 4px 10px rgba(0,0,0,.45); display: grid; place-items: center; }
.cr-back svg { width: 60%; opacity: .85; }

.cr-who { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
.cr-who b { font-family: var(--f-display); font-size: 26px; color: var(--fg); font-weight: 400; line-height: 1; }
.cr-who .pill { margin-left: auto; font-size: 12px; padding: 2px 10px; border-radius: 999px; background: var(--accent); color: var(--accent-fg); }
.cr-row { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 5px; }
.cr-pile { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; padding: 4px 2px; border-radius: 10px; background: rgba(0, 0, 0, .22); border: 1px solid transparent; }
.cr-pile svg { width: 82%; opacity: .25; filter: grayscale(1); }
.cr-pile.has svg { opacity: 1; filter: none; }
.cr-pile .cnt { display: flex; gap: 2px; }
.cr-pile .cnt i { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,.15); }
.cr-pile .cnt i.on { background: var(--a); box-shadow: 0 0 0 1px rgba(255,255,255,.6); }
.cr-pile.warn { border-color: var(--danger); background: rgba(255, 107, 91, .12); }
.cr-pile.warn .cnt i.on { background: var(--danger); }
.cr-pile.dead { border-color: var(--danger); background: rgba(255, 107, 91, .3); }
.cr-pile.new { animation: thud .6s ease-out; }
@keyframes thud { 0% { transform: translateY(-14px) scale(1.15); } 60% { transform: translateY(2px) scale(.97); } }

.cr-table { display: flex; gap: 14px; align-items: center; justify-content: center; padding: 14px 12px; border-radius: 18px; background: rgba(0, 0, 0, .25); border: 1px dashed var(--line); min-height: 150px; }
.cr-table .slot { width: 96px; flex: none; }
.cr-table .talk { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.cr-bubble { position: relative; background: #fff8dc; color: #2a2a1a; border-radius: 16px; padding: 10px 14px; font-size: 15px; line-height: 1.35; max-width: 220px; }
.cr-bubble::before { content: ""; position: absolute; left: -9px; top: 22px; border: 6px solid transparent; border-right: 9px solid #fff8dc; border-left: 0; }
.cr-bubble b { font-family: var(--f-display); font-size: 24px; font-weight: 400; color: #fff8dc; background: var(--a); padding: 0 7px; border-radius: 7px; }
.duo-btn b { font-size: 22px; font-weight: 400; }
.duo-pill, .duo-tab { font-family: var(--f-body); }
.cr-verdict { font-family: var(--f-display); font-size: 26px; line-height: 1.1; }
.cr-verdict.ok { color: var(--ok); } .cr-verdict.bad { color: var(--danger); }
.cr-flip { animation: flip .6s ease-out; transform-origin: 50% 50%; }
@keyframes flip { 0% { transform: rotateY(90deg); } 100% { transform: rotateY(0); } }
.cr-say { margin: 0; text-align: center; font-size: 14px; min-height: 1.5em; text-wrap: balance; }
.cr-say em { font-style: normal; color: var(--accent); }

.cr-hand { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.cr-hand button { position: relative; border: none; background: none; padding: 0; transition: transform .15s ease; min-width: 0; }
.cr-hand button .x { position: absolute; right: -4px; top: -6px; min-width: 24px; height: 24px; padding: 0 5px; border-radius: 999px; background: var(--accent); color: var(--accent-fg); font-weight: 700; font-size: 13px; display: grid; place-items: center; box-shadow: 0 2px 4px rgba(0,0,0,.4); box-sizing: border-box; }
.cr-hand button.sel { transform: translateY(-8px) rotate(-2deg); }
.cr-hand button.sel .cr-card { box-shadow: inset 0 0 0 3px #fff, 0 0 0 3px var(--accent), 0 10px 16px rgba(0,0,0,.5); }
.cr-hand button:disabled { cursor: default; }
.cr-hand button:disabled .cr-card { filter: saturate(.75) brightness(.9); }
.cr-claims { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.cr-claims button { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 2px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); font-size: 12.5px; min-width: 0; }
.cr-claims button svg { width: 42px; }
.cr-claims button[aria-pressed=true] { border-color: var(--accent); background: rgba(232, 197, 71, .18); color: var(--accent); }
.cr-claims button .lie { font-size: 10px; color: var(--danger); }
.cr-act { display: flex; gap: 8px; }
.cr-act .duo-btn { flex: 1; }
.cr-act .duo-btn.true b { color: var(--ok); }
.cr-act .duo-btn.false b { color: var(--danger); }
.rule-anis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; max-width: 360px; }
@media (max-width: 380px) { .cr-row { gap: 3px; } .cr-table .slot { width: 80px; } }
</style>
</head>
<body>
<div class="duo" id="app"></div>
<div id="layer"></div>
<script src="../shared/duo.js"></script>
<script>
(() => {
"use strict";
const { esc, shuffle, rnd } = DuoUtil;

/* ───── eight critters ───── */
const ANI = ["바퀴벌레", "쥐", "박쥐", "파리", "두꺼비", "전갈", "거미", "노린재"];
// 받침이 있으면 "전갈이야", 없으면 "쥐야"
const jong = w => { const c = w.charCodeAt(w.length - 1) - 0xac00; return c >= 0 && c < 11172 && c % 28 !== 0; };
const ya = a => ANI[a] + (jong(ANI[a]) ? "이야" : "야");
const ga = a => ANI[a] + (jong(ANI[a]) ? "이" : "가");
const ART = [
  // 바퀴벌레
  `<svg viewBox="0 0 64 64" aria-hidden="true"><g stroke="#2b1a0c" stroke-width="2.2" stroke-linecap="round" fill="none"><path d="M26 14 C18 4 10 6 6 2"/><path d="M38 14 C46 4 54 6 58 2"/><path d="M20 28 L8 22 M20 36 L6 38 M22 44 L10 54 M44 28 L56 22 M44 36 L58 38 M42 44 L54 54"/></g><ellipse cx="32" cy="38" rx="13" ry="20" fill="#5a3415"/><path d="M32 18 V58" stroke="#2b1a0c" stroke-width="1.5"/><ellipse cx="32" cy="38" rx="9" ry="15" fill="#7a4a20" opacity=".7"/><ellipse cx="32" cy="17" rx="7" ry="5" fill="#3d2410"/><circle cx="28.5" cy="16" r="1.4" fill="#fff"/><circle cx="35.5" cy="16" r="1.4" fill="#fff"/></svg>`,
  // 쥐
  `<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M50 44 C60 46 60 58 48 58" stroke="#e7b3a6" stroke-width="2.5" fill="none" stroke-linecap="round"/><ellipse cx="34" cy="40" rx="18" ry="14" fill="#9aa3ad"/><path d="M8 34 C14 22 26 22 30 30 L30 42 C20 44 12 42 8 34Z" fill="#b5bec7"/><circle cx="22" cy="22" r="7" fill="#9aa3ad"/><circle cx="22" cy="22" r="4" fill="#e7b3a6"/><circle cx="17" cy="32" r="2" fill="#1a1a1a"/><circle cx="8.5" cy="34.5" r="2" fill="#e77a8a"/><path d="M8 36 L1 34 M8 37 L1 40" stroke="#555" stroke-width="1"/></svg>`,
  // 박쥐
  `<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M32 26 C24 16 10 16 2 24 C8 26 10 32 8 38 C14 34 18 36 20 42 C24 36 28 38 32 44 C36 38 40 36 44 42 C46 36 50 34 56 38 C54 32 56 26 62 24 C54 16 40 16 32 26Z" fill="#3a2d55"/><ellipse cx="32" cy="32" rx="7" ry="10" fill="#2a1f40"/><path d="M27 23 L26 15 L30 21 M37 23 L38 15 L34 21" fill="#2a1f40"/><circle cx="29.5" cy="27" r="1.6" fill="#ffd34a"/><circle cx="34.5" cy="27" r="1.6" fill="#ffd34a"/><path d="M30 32 L31 34 L32 32 L33 34 L34 32" stroke="#fff" stroke-width="1" fill="none"/></svg>`,
  // 파리
  `<svg viewBox="0 0 64 64" aria-hidden="true"><ellipse cx="20" cy="26" rx="14" ry="9" fill="#cfe7ef" opacity=".75" transform="rotate(-25 20 26)" stroke="#8ab" stroke-width="1"/><ellipse cx="44" cy="26" rx="14" ry="9" fill="#cfe7ef" opacity=".75" transform="rotate(25 44 26)" stroke="#8ab" stroke-width="1"/><g stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"><path d="M26 40 L16 48 M27 44 L20 56 M38 40 L48 48 M37 44 L44 56"/></g><ellipse cx="32" cy="42" rx="9" ry="13" fill="#24282b"/><path d="M24 40 H40 M24 46 H40" stroke="#3d6f7a" stroke-width="2"/><circle cx="32" cy="26" r="8" fill="#24282b"/><circle cx="27" cy="25" r="4.5" fill="#c43a2a"/><circle cx="37" cy="25" r="4.5" fill="#c43a2a"/></svg>`,
  // 두꺼비
  `<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M8 52 C4 34 18 26 32 26 C46 26 60 34 56 52 Z" fill="#4d7a2a"/><circle cx="20" cy="26" r="8" fill="#5e9134"/><circle cx="44" cy="26" r="8" fill="#5e9134"/><circle cx="20" cy="25" r="4.5" fill="#f3e17a"/><circle cx="44" cy="25" r="4.5" fill="#f3e17a"/><rect x="18" y="23.5" width="4" height="3" rx="1" fill="#1a1a1a"/><rect x="42" y="23.5" width="4" height="3" rx="1" fill="#1a1a1a"/><path d="M16 40 C26 46 38 46 48 40" stroke="#2c4a14" stroke-width="2.4" fill="none" stroke-linecap="round"/><circle cx="14" cy="47" r="2" fill="#7aa84a"/><circle cx="50" cy="47" r="2.5" fill="#7aa84a"/><circle cx="32" cy="50" r="1.8" fill="#7aa84a"/><path d="M6 54 C10 50 14 54 12 56 M58 54 C54 50 50 54 52 56" stroke="#4d7a2a" stroke-width="3" fill="none"/></svg>`,
  // 전갈
  `<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M34 40 C46 40 52 30 50 20 C49 14 44 10 40 12" stroke="#9a5a18" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M40 12 L36 6 L42 8Z" fill="#3a1e05"/><ellipse cx="26" cy="44" rx="12" ry="8" fill="#b36d22"/><path d="M18 40 C10 34 6 30 8 26 M18 46 C10 50 6 52 6 56" stroke="#9a5a18" stroke-width="3" fill="none"/><path d="M4 22 C8 18 14 22 10 28 C8 26 6 26 4 22Z M2 52 C6 56 12 56 10 58 C6 60 2 58 2 52Z" fill="#b36d22"/><g stroke="#7a440f" stroke-width="1.8"><path d="M22 51 L20 58 M28 52 L28 59 M33 50 L36 57"/></g><circle cx="17" cy="42" r="1.4" fill="#1a1a1a"/></svg>`,
  // 거미
  `<svg viewBox="0 0 64 64" aria-hidden="true"><g stroke="#1b1b20" stroke-width="2.4" fill="none" stroke-linecap="round"><path d="M26 30 L12 18 L6 26 M26 34 L8 32 L2 40 M26 38 L10 46 L8 56 M28 40 L18 54 L18 62 M38 30 L52 18 L58 26 M38 34 L56 32 L62 40 M38 38 L54 46 L56 56 M36 40 L46 54 L46 62"/></g><circle cx="32" cy="40" r="12" fill="#2a2a32"/><path d="M28 36 L32 44 L36 36 L32 40Z" fill="#c43a2a"/><circle cx="32" cy="25" r="7" fill="#1b1b20"/><circle cx="29" cy="24" r="1.6" fill="#e33"/><circle cx="35" cy="24" r="1.6" fill="#e33"/><circle cx="31" cy="21" r="1" fill="#e33"/><circle cx="33" cy="21" r="1" fill="#e33"/></svg>`,
  // 노린재
  `<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M18 10 C14 6 10 6 8 8 M46 10 C50 6 54 6 56 8" stroke="#3a3f10" stroke-width="2" fill="none" stroke-linecap="round"/><g stroke="#3a3f10" stroke-width="2" stroke-linecap="round"><path d="M18 30 L8 28 M18 38 L8 44 M22 46 L14 54 M46 30 L56 28 M46 38 L56 44 M42 46 L50 54"/></g><path d="M32 14 C24 14 18 20 16 28 L32 58 L48 28 C46 20 40 14 32 14Z" fill="#6e7d22"/><path d="M20 28 H44 L32 50Z" fill="#8c9c2e"/><path d="M32 28 V56" stroke="#3a3f10" stroke-width="1.3"/><circle cx="28" cy="20" r="1.5" fill="#1a1a1a"/><circle cx="36" cy="20" r="1.5" fill="#1a1a1a"/><path d="M52 12 C56 10 54 6 58 4 M58 16 C62 14 60 10 63 9" stroke="#b8c86a" stroke-width="1.5" fill="none" opacity=".9"/></svg>`,
];
const cardHTML = (a, extra = "") => `<div class="cr-card cr-ani a${a} ${extra}" aria-label="${ANI[a]}">${ART[a]}<span class="nm">${ANI[a]}</span></div>`;
const backHTML = () => `<div class="cr-back" aria-label="뒤집힌 카드">${ART[0].replace(/#5a3415/g, "#e8c547").replace(/#7a4a20/g, "#c9a830").replace(/#3d2410/g, "#b89520")}</div>`;
const MARK = `<svg class="mark-cr" viewBox="0 0 64 64" aria-hidden="true">${ART[0].replace(/^<svg[^>]*>|<\/svg>$/g, "")}</svg>`;

/* ───── rules engine ───── */
function deal(hand) {
  const deck = []; let id = 0;
  for (let a = 0; a < 8; a++) for (let k = 0; k < 8; k++) deck.push({ id: id++, a });
  shuffle(deck);
  const n = hand === "short" ? 12 : 32;
  return [deck.slice(0, n), deck.slice(32, 32 + n)];
}
const game = {
  id: "cockroach",
  title: "바퀴벌레 포커",
  mark: MARK,
  tagline: "\"이건 쥐야.\" 진짜일까, 거짓말일까? 같은 벌레 네 마리가 내 앞에 쌓이면 져요.",
  options: [{ id: "hand", label: "손패", def: "full", choices: [{ v: "full", label: "32장씩 (정식)" }, { v: "short", label: "12장씩 (짧게)" }] }],
  setup(players, opts) {
    return { hands: deal(opts.hand), rows: [Array(8).fill(0), Array(8).fill(0)], turn: rnd(2), phase: "give", offer: null, last: null, loser: null, why: "", log: [] };
  },
  apply(g, seat, a, env) {
    const N = env.names;
    if (g.loser != null) return null;
    if (a.type === "give") {
      if (g.phase !== "give" || seat !== g.turn || !(a.claim >= 0 && a.claim < 8)) return null;
      const i = g.hands[seat].findIndex(c => c.id === a.id);
      if (i < 0) return null;
      const card = g.hands[seat].splice(i, 1)[0];
      g.offer = { card, claim: a.claim, from: seat };
      g.phase = "call";
      g.log.push(`${N[seat]}: "이건 ${ya(a.claim)}."`);
      return g;
    }
    if (a.type === "call") {
      if (g.phase !== "call" || seat !== 1 - g.turn || (a.say !== "true" && a.say !== "false")) return null;
      const { card, claim, from } = g.offer;
      const truth = card.a === claim;
      const right = (a.say === "true") === truth;
      const taker = right ? from : seat;
      g.rows[taker][card.a] += 1;
      g.last = { from, to: seat, card, claim, say: a.say, truth, right, taker };
      g.log.push(`${N[seat]}: "${a.say === "true" ? "진짜" : "거짓말"}!" → 실제는 ${ANI[card.a]}. ${right ? "맞혀서" : "틀려서"} ${N[taker]} 님이 가져가요`);
      g.offer = null;
      if (g.rows[taker][card.a] >= 4) { g.loser = taker; g.why = `${ANI[card.a]} 4마리가 모였어요`; }
      else if (!g.hands[taker].length) { g.loser = taker; g.why = "건넬 카드가 남지 않았어요"; }
      else { g.turn = taker; g.phase = "give"; }
      return g;
    }
    return null;
  },
  result(g, ctx) {
    if (g.loser == null) return null;
    const N = ctx.names, w = 1 - g.loser;
    return { title: `${esc(N[w])} 님 승리!`, html: `<p style="text-align:center;margin:0">${esc(N[g.loser])} 님 앞에 ${esc(g.why)}</p>
      <div class="cr-row" style="margin-top:4px">${g.rows[g.loser].map((n, a) => pileHTML(a, n, false)).join("")}</div>` };
  },
  render(ctx) {
    const g = ctx.g, N = ctx.names, ui = ctx.ui;
    const me = ctx.me < 0 ? 0 : ctx.me, op = 1 - me, spect = ctx.me < 0;
    const giving = !spect && g.phase === "give" && g.turn === me && g.loser == null;
    const calling = !spect && g.phase === "call" && g.turn === op && g.loser == null;
    const lastKey = g.last ? g.last.card.id : -1;
    const fresh = ui.seenLast !== lastKey; ui.seenLast = lastKey;
    const newPile = g.last && fresh ? g.last.taker + ":" + g.last.card.a : "";

    const row = s => `<div class="cr-row">${g.rows[s].map((n, a) => pileHTML(a, n, newPile === s + ":" + a)).join("")}</div>`;
    const who = (s, label) => `<div class="cr-who"><b>${label}</b><span>손패 ${g.hands[s].length}장</span>${(g.phase === "give" ? g.turn : 1 - g.turn) === s && g.loser == null ? `<span class="pill">${g.phase === "give" ? "건넬 차례" : "판단할 차례"}</span>` : ""}</div>`;

    // 가운데: 지금 건네진 카드 또는 방금 공개된 카드
    let table;
    if (g.phase === "call" && g.offer) {
      const o = g.offer;
      table = `<div class="cr-table"><div class="slot">${backHTML()}</div><div class="talk">
        <div class="cr-bubble a${o.claim}">${esc(N[o.from])}: "이건 <b>${ANI[o.claim]}</b>${jong(ANI[o.claim]) ? "이야" : "야"}."</div>
        <span class="duo-note">${calling ? "진짜일까요, 거짓말일까요?" : `${esc(N[op])} 님이 고민 중…`}</span></div></div>`;
    } else if (g.last) {
      const l = g.last;
      table = `<div class="cr-table"><div class="slot">${cardHTML(l.card.a, fresh ? "cr-flip" : "")}</div><div class="talk">
        <div class="cr-bubble a${l.claim}">${esc(N[l.from])}: "이건 <b>${ANI[l.claim]}</b>${jong(ANI[l.claim]) ? "이야" : "야"}."</div>
        <span class="cr-verdict ${l.right ? "ok" : "bad"}">${esc(N[l.to])}: "${l.say === "true" ? "진짜" : "거짓말"}!" — ${l.right ? "맞혔다!" : "틀렸다!"}</span>
        <span class="duo-note">${l.truth ? "진짜였어요" : `거짓말이었어요 (실제는 ${ANI[l.card.a]})`} · ${esc(N[l.taker])} 님이 가져감</span></div></div>`;
    } else table = `<div class="cr-table"><span class="duo-note">아직 아무도 카드를 건네지 않았어요</span></div>`;

    let say = "", controls = "";
    if (g.loser != null) say = "";
    else if (spect) say = g.phase === "give" ? `${esc(N[g.turn])} 님이 건넬 카드를 고르는 중` : `${esc(N[1 - g.turn])} 님이 판단하는 중`;
    else if (calling) {
      say = `받은 카드는 보지 못해요. ${esc(N[op])} 님 말이 <em>진짜</em>일까요?`;
      controls = `<div class="cr-act"><button class="duo-btn true center" data-a="call" data-v="true"><b>진짜다!</b><span>정말 ${ANI[g.offer.claim]}일 것 같아요</span></button>
        <button class="duo-btn false center" data-a="call" data-v="false"><b>거짓말!</b><span>${ga(g.offer.claim)} 아닐 거예요</span></button></div>`;
    } else if (giving) {
      const sel = ui.sel != null ? g.hands[me].find(c => c.a === ui.sel) : null;
      if (ui.sel != null && !sel) ui.sel = null;
      say = ui.sel == null ? `${esc(N[op])} 님에게 건넬 카드를 고르세요` : `<em>${ANI[ui.sel]}</em> 카드를 건네요. 뭐라고 말할까요? (거짓말해도 돼요)`;
      if (ui.sel != null) {
        controls = `<div class="cr-claims" role="group" aria-label="뭐라고 말할까">${ANI.map((nm, a) => `<button data-a="claim" data-v="${a}" aria-pressed="${ui.claim === a}">${ART[a]}<span>${nm}</span>${a !== ui.sel ? `<span class="lie">거짓말</span>` : `<span class="lie" style="color:var(--ok)">진실</span>`}</button>`).join("")}</div>
          ${ui.claim != null ? `<div class="cr-act"><button class="duo-btn primary center" data-a="give"><b>"이건 ${ya(ui.claim)}" 하고 건네기</b><span>${ui.claim === ui.sel ? "진실을 말해요" : `사실은 ${ANI[ui.sel]}`}</span></button></div>` : ""}`;
      }
    } else say = g.phase === "give" ? `${esc(N[op])} 님이 건넬 카드를 고르는 중…` : `${esc(N[op])} 님이 판단하는 중…`;

    // 손패: 같은 동물끼리 묶어서
    const counts = Array(8).fill(0); g.hands[me].forEach(c => counts[c.a]++);
    const hand = spect ? "" : `<div class="cr-hand">${counts.map((n, a) => n ? `<button data-a="pick" data-v="${a}" class="${ui.sel === a ? "sel" : ""}" ${giving ? "" : "disabled"} aria-label="${ANI[a]} ${n}장">${cardHTML(a)}<span class="x">${n}</span></button>` : "").join("")}</div>`;

    return `${who(op, esc(N[op]))}${row(op)}
      ${table}
      <p class="cr-say">${say}</p>${controls}
      ${row(me)}${who(me, spect ? esc(N[me]) : "나 (" + esc(N[me]) + ")")}
      ${hand}`;
  },
  onClick(el, ctx) {
    const a = el.dataset.a, ui = ctx.ui, g = ctx.g;
    if (a === "pick") { const v = +el.dataset.v; ui.sel = ui.sel === v ? null : v; ui.claim = null; ctx.rerender(); }
    else if (a === "claim") { ui.claim = +el.dataset.v; ctx.rerender(); }
    else if (a === "give") {
      const card = g.hands[ctx.me].find(c => c.a === ui.sel);
      if (card && ui.claim != null && ctx.act({ type: "give", id: card.id, claim: ui.claim })) { ui.sel = null; ui.claim = null; }
    } else if (a === "call") ctx.act({ type: "call", say: el.dataset.v });
  },
  rules: `
  <p>뻔뻔하게 거짓말하고, 상대 표정을 읽는 블러핑 게임이에요. 이기는 게 아니라 <b>지지 않는</b> 게 목표예요.</p>
  <h3>카드</h3>
  <p>여덟 가지 벌레가 8장씩, 모두 64장. 둘이 32장씩 나눠 들어요.</p>
  <div class="rule-anis">${ANI.map((_, a) => cardHTML(a)).join("")}</div>
  <h3>내 차례</h3>
  <ol><li>손에서 카드 한 장을 골라 <b>뒤집은 채로</b> 상대에게 건네요.</li>
  <li>건네면서 <b>"이건 ○○야"</b>라고 말해요. 사실이어도 되고 거짓말이어도 돼요.</li></ol>
  <h3>받은 사람</h3>
  <p>카드를 보지 않고 <b>"진짜다"</b> 또는 <b>"거짓말이다"</b> 중 하나를 말해요. 그리고 카드를 공개해요.</p>
  <ul><li><b>맞혔으면</b> 건넨 사람이 그 카드를 자기 앞에 앞면으로 놓아요.</li>
  <li><b>틀렸으면</b> 받은 사람이 그 카드를 자기 앞에 놓아요.</li></ul>
  <p>카드를 가져간 사람이 다음에 카드를 건네요.</p>
  <h3>지는 때</h3>
  <ul><li>내 앞에 <b>같은 벌레가 4장</b> 모이면 져요.</li>
  <li>카드를 건넬 차례인데 손에 카드가 없으면 져요.</li></ul>
  <h3>2인 규칙</h3>
  <p>3명 이상일 때는 카드를 몰래 보고 다른 사람에게 넘길 수 있지만, 둘이서는 넘길 사람이 없어서 받으면 바로 판단해야 해요.</p>
  <h3>이 화면 보는 법</h3>
  <ul><li>앞에 놓인 벌레는 점으로 몇 장인지 보여요. 3장이 된 벌레는 빨갛게 경고해요.</li>
  <li>내 손패는 같은 벌레끼리 묶여 있고, 오른쪽 위 숫자가 장수예요.</li>
  <li>카드를 고르고 할 말을 고르면 "건네기" 버튼이 나와요. 할 말 아래 '진실/거짓말' 표시는 나만 보여요.</li></ul>`,
};
function pileHTML(a, n, isNew) {
  return `<div class="cr-pile cr-ani a${a} ${n ? "has" : ""} ${n === 3 ? "warn" : ""} ${n >= 4 ? "dead" : ""} ${isNew ? "new" : ""}" aria-label="${ANI[a]} ${n}장">${ART[a]}<span class="cnt">${[0, 1, 2, 3].map(i => `<i class="${i < n ? "on" : ""}"></i>`).join("")}</span></div>`;
}
Duo(game);
})();
</script>
</body>
</html>
