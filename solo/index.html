<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>혼자 게임방</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=Gowun+Dodum&family=IBM+Plex+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="solo.css?v=dev">
<style>
/* Layout: three puzzle sheets on the desk, each with today's progress per level underneath. */
.hero { display: flex; flex-direction: column; gap: 6px; padding-top: 14px; }
.hero h1 { margin: 0; font-family: var(--f-head); font-size: clamp(30px, 8vw, 40px); }
.hero h1 span { color: var(--accent); }
.hero p { margin: 0; color: var(--muted); font-size: 14px; }
.games { display: flex; flex-direction: column; gap: 12px; }
.game { display: grid; grid-template-columns: 96px 1fr; gap: 14px; align-items: center; padding: 12px; border-radius: 16px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); text-decoration: none; transition: transform .15s ease, border-color .15s ease; }
.game:hover, .game:focus-visible { border-color: var(--accent); transform: translateY(-2px); }
.game svg { width: 96px; height: 96px; display: block; border-radius: 10px; }
.game .name { font-family: var(--f-head); font-size: 20px; font-weight: 700; }
.game .desc { margin: 2px 0 6px; font-size: 13.5px; color: #cfc9bd; }
.game .today { display: flex; gap: 6px; flex-wrap: wrap; font-size: 12px; }
.game .today span { padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.game .today span.ok { border-color: var(--ok); color: var(--ok); }
footer { color: var(--muted); font-size: 12.5px; border-top: 1px solid var(--line); padding-top: 12px; }
@media (prefers-reduced-motion: reduce) { .game { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <h1>혼자 <span>게임방</span></h1>
    <p>머리 쓰는 1인용 퍼즐. 어려움 · 극악 · 악몽, 매일 바뀌는 오늘의 퍼즐.</p>
  </header>
  <main class="games" id="games"></main>
  <footer>모든 퍼즐은 그때그때 새로 만들어지고, 답이 하나뿐인지 끝까지 확인한 것만 나와요. 같은 날 같은 난이도의 오늘의 퍼즐은 누구에게나 똑같아요. 기록은 이 기기에 저장돼요.</footer>
</div>
<script src="solo.js?v=dev"></script>
<script>
"use strict";
const GAMES = [
  { id: "stars", href: "stars/", name: "스타 배틀", desc: "줄·열·구역마다 별 두 개. 별끼리는 대각선으로도 닿으면 안 돼요.",
    art: `<svg viewBox="0 0 96 96"><rect width="96" height="96" fill="#f3eee2"/><g stroke="#1d2433" stroke-width="2.5"><rect x="8" y="8" width="40" height="32" fill="#f5d6a1"/><rect x="48" y="8" width="40" height="48" fill="#c9def3"/><rect x="8" y="40" width="40" height="48" fill="#d3ebc8"/><rect x="48" y="56" width="40" height="32" fill="#f3c9d3"/></g><g font-size="16" text-anchor="middle" fill="#1d2433"><text x="20" y="30">★</text><text x="76" y="46">★</text><text x="36" y="78">★</text><text x="64" y="78">★</text></g></svg>` },
  { id: "code", href: "code/", name: "코드 추리", desc: "남이 짐작해 본 기록(S·B)만으로 숨겨진 번호를 알아내요.",
    art: `<svg viewBox="0 0 96 96"><rect width="96" height="96" fill="#1a2030"/>${[["4","7","1","9","1S","2B"],["0","7","5","3","0S","1B"],["?","?","?","?","",""]].map((r,y)=>r.slice(0,4).map((d,x)=>`<rect x="${8+x*15}" y="${14+y*26}" width="13" height="18" rx="2" fill="${y===2?"rgba(243,238,226,.18)":"#f3eee2"}"/><text x="${14.5+x*15}" y="${27+y*26}" text-anchor="middle" font-family="monospace" font-weight="700" font-size="12" fill="${y===2?"#f0b45a":"#1d2433"}">${d}</text>`).join("")+(r[4]?`<text x="70" y="${27+y*26}" font-family="monospace" font-size="9" fill="#67c98f">${r[4]}</text><text x="83" y="${27+y*26}" font-family="monospace" font-size="9" fill="#f0b45a">${r[5]}</text>`:"")).join("")}</svg>` },
];
const today = (() => { const d = new Date(), p = n => String(n).padStart(2, "0"); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`; })();
document.getElementById("games").innerHTML = GAMES.map(g => {
  const marks = Solo.LEVELS.map(l => {
    const s = Solo.store.get(`solo:${g.id}:${l}:${today}`, null), ok = s && s.done && !s.gaveUp;
    return `<span class="${ok ? "ok" : ""}">${ok ? "✓ " : ""}${Solo.LEVEL_NAME[l]}</span>`;
  }).join("");
  return `<a class="game" href="${g.href}">${g.art}<div><div class="name">${g.name}</div><p class="desc">${g.desc}</p><div class="today" aria-label="오늘의 퍼즐">${marks}</div></div></a>`;
}).join("");
</script>
</body>
</html>
