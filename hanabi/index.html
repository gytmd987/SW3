<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}</style>
</head>
<body>
<title>둘이서 하나비</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap">
<style>
/* Layout: one-screen night-sky table — partner's hand on top, the five firework stacks in the middle, your hidden hand at the bottom. */
:root {
  color-scheme: dark;
  --night: #0a0e22;
  --night-2: #151b3d;
  --panel: rgba(22, 28, 64, .72);
  --line: rgba(236, 230, 214, .14);
  --ink: #ece6d6;
  --muted: #9ba1c4;
  --gold: #e9b54f;
  --gold-soft: rgba(233, 181, 79, .18);
  --danger: #ff6b6b;
  --c-r: #ff4d5e;
  --c-y: #ffd23f;
  --c-g: #3fdc8a;
  --c-b: #4fa6ff;
  --c-w: #f4f1ea;
  --card-back: #1b2150;
  --f-mark: "Yuji Syuku", "Gowun Batang", serif;
  --f-head: "Gowun Batang", "Nanum Myeongjo", serif;
  --f-body: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --card-w: min(17vw, 76px);
  --cc: var(--c-w); --cc-deep: #1c1f33; --cc-glow: #6b6e88; --cc-soft: rgba(244,241,234,.45);
}
html, body { height: 100%; }
body {
  background: radial-gradient(120% 80% at 50% 0%, var(--night-2) 0%, var(--night) 62%) fixed, var(--night);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 15px;
  line-height: 1.5;
  overflow-x: hidden;
}
#sky, #fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
#sky { z-index: 0; }
#fx { z-index: 60; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, .card:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

.app {
  position: relative; z-index: 1;
  max-width: 560px; margin: 0 auto;
  padding-inline: 16px; padding-block: 10px 18px;
  min-height: 100%;
  display: flex; flex-direction: column; gap: 12px;
}

/* top bar */
.bar { display: flex; align-items: center; gap: 10px; }
.logo { font-family: var(--f-mark); font-size: 30px; line-height: 1; color: var(--gold); text-shadow: 0 0 18px rgba(233,181,79,.45); letter-spacing: .02em; }
.logo small { font-family: var(--f-head); font-size: 12px; color: var(--muted); margin-left: 6px; letter-spacing: .1em; }
.bar .sp { flex: 1; }
.iconbtn { background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-size: 13px; color: var(--ink); }
.iconbtn:hover { border-color: var(--gold); }
a.iconbtn { text-decoration: none; }

.status { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); font-size: 13px; }
.tok { display: flex; align-items: center; gap: 6px; }
.tok .lbl { color: var(--muted); letter-spacing: .04em; }
.dots { display: flex; gap: 3px; }
.dot { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--c-b); }
.dot.on { background: var(--c-b); box-shadow: 0 0 6px var(--c-b); }
.fuse { width: 12px; height: 12px; border-radius: 3px; border: 1.5px solid var(--danger); transform: rotate(45deg); }
.fuse.on { background: var(--danger); box-shadow: 0 0 8px var(--danger); }
.num { font-variant-numeric: tabular-nums; font-weight: 700; }

/* hands */
.side { display: flex; flex-direction: column; gap: 6px; }
.side-head { display: flex; align-items: baseline; gap: 8px; font-size: 13px; color: var(--muted); }
.side-head b { font-family: var(--f-head); font-size: 16px; color: var(--ink); }
.side-head .turnpill { margin-left: auto; font-size: 12px; padding: 2px 10px; border-radius: 999px; background: var(--gold); color: var(--night); font-weight: 700; }
.hand { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.slot { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; }

.card {
  position: relative; width: 100%; max-width: var(--card-w); aspect-ratio: 5 / 7.4;
  border-radius: 9px; border: none; padding: 0; overflow: hidden;
  display: grid; place-items: center;
  transition: transform .18s ease, box-shadow .18s ease;
  -webkit-tap-highlight-color: transparent;
}
.card.face { background-color: var(--cc-deep); background-image: radial-gradient(circle at 50% 42%, var(--cc-glow) 0%, var(--cc-deep) 78%); color: var(--cc); box-shadow: inset 0 0 0 1.5px var(--cc), 0 4px 12px rgba(0,0,0,.4); }
/* 흰 불꽃은 밝은 종이 카드에 짙은 숫자로 — 어떤 브라우저에서도 바탕과 숫자가 같은 색이 되지 않게 */
.card.face.c-w { background-color: #e9e6f2; background-image: radial-gradient(circle at 50% 42%, #ffffff 0%, #d9d5e6 80%); color: #6c6a85; }
.card.face.c-w .big { color: #14183a; text-shadow: 0 0 6px #fff; }
.card.face.c-w .corner { color: #14183a; }
.card.face svg { position: absolute; inset: 8% 6%; width: 88%; height: 84%; opacity: .9; }
.card.face .big { position: relative; font-family: var(--f-mark); font-size: calc(var(--card-w) * .5); line-height: 1; color: #fff; text-shadow: 0 0 10px var(--cc), 0 0 2px var(--cc); }
.card .corner { position: absolute; font-family: var(--f-mark); font-size: 12px; line-height: 1; }
.card .tl { top: 5px; left: 6px; }
.card .br { bottom: 5px; right: 6px; transform: rotate(180deg); }
.c-r { --cc: var(--c-r); --cc-deep: #2a0c18; --cc-glow: #8a1f33; --cc-soft: rgba(255,77,94,.45); }
.c-y { --cc: var(--c-y); --cc-deep: #2a2208; --cc-glow: #8a6c12; --cc-soft: rgba(255,210,63,.45); }
.c-g { --cc: var(--c-g); --cc-deep: #082a1c; --cc-glow: #17794a; --cc-soft: rgba(63,220,138,.45); }
.c-b { --cc: var(--c-b); --cc-deep: #0a1a38; --cc-glow: #1d5aa3; --cc-soft: rgba(79,166,255,.45); }
.c-w { --cc: var(--c-w); --cc-deep: #1c1f33; --cc-glow: #6b6e88; --cc-soft: rgba(244,241,234,.45); }

.card.back {
  background:
    repeating-linear-gradient(60deg, transparent 0 9px, rgba(233,181,79,.07) 9px 10px),
    repeating-linear-gradient(-60deg, transparent 0 9px, rgba(233,181,79,.07) 9px 10px),
    var(--card-back);
  box-shadow: inset 0 0 0 1.5px rgba(233,181,79,.35), 0 4px 12px rgba(0,0,0,.4);
  color: var(--gold);
}
.card.back .kanji { font-family: var(--f-mark); font-size: calc(var(--card-w) * .34); opacity: .5; }
.card.back.kc { box-shadow: inset 0 0 0 2.5px var(--cc), 0 0 14px var(--cc-soft); background-color: var(--card-back); background-image: radial-gradient(circle at 50% 45%, var(--cc-soft) 0%, var(--card-back) 75%); }
.card.back .known { font-family: var(--f-mark); font-size: calc(var(--card-w) * .5); line-height: 1; color: #fff; text-shadow: 0 0 10px var(--cc); }
.card.back.kc .kanji, .card.back.kn .kanji { display: none; }
.card.back .kanji + .known { position: absolute; }
.card.hinted { animation: hintpulse 1.6s ease-in-out infinite; }
@keyframes hintpulse { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
.card.hinted::after { content: ""; position: absolute; inset: 0; border-radius: 9px; box-shadow: inset 0 0 0 2px #fff, 0 0 16px rgba(255,255,255,.6); pointer-events: none; }
.card.preview::after { content: ""; position: absolute; inset: 0; border-radius: 9px; box-shadow: inset 0 0 0 3px var(--gold); pointer-events: none; }
.card.newcard::before { content: "새 카드"; position: absolute; top: 3px; left: 50%; transform: translateX(-50%); font-size: 9px; padding: 0 5px; border-radius: 4px; background: var(--gold); color: var(--night); z-index: 1; white-space: nowrap; }
.card.selected { transform: translateY(-8px) scale(1.04); }
button.card:hover { transform: translateY(-3px); }
button.card:disabled { cursor: default; }
button.card:disabled:hover { transform: none; }

.info { display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 26px; }
.pc { display: flex; gap: 2px; }
.pc i { width: 7px; height: 7px; border-radius: 50%; background: var(--cc); }
.pn { font-size: 10px; letter-spacing: .08em; color: var(--muted); font-variant-numeric: tabular-nums; }
.theyknow { font-size: 10px; color: var(--muted); display: flex; gap: 3px; align-items: center; }
.theyknow .k { padding: 0 4px; border-radius: 4px; border: 1px solid var(--line); min-width: 14px; text-align: center; }
.theyknow .k.on { border-color: var(--cc); color: var(--cc); }

/* field */
.field { border: 1px solid var(--line); border-radius: 16px; background: var(--panel); padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.stacks { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.stack { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.stack .pile { width: 100%; max-width: var(--card-w); aspect-ratio: 5 / 7.4; border-radius: 9px; display: grid; place-items: center; border: 1.5px dashed var(--cc-soft); position: relative; }
.stack .pile.has { border: none; }
.stack .pile .zero { font-family: var(--f-mark); font-size: 20px; color: var(--cc-soft); }
.stack .lbl { font-size: 11px; color: var(--cc); letter-spacing: .06em; }
.stack.done .pile { box-shadow: 0 0 20px var(--cc); border-radius: 9px; }
.lastline { font-size: 13.5px; text-align: center; color: var(--ink); min-height: 1.5em; text-wrap: balance; }
.lastline em { font-style: normal; color: var(--gold); }
.discards { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 12px; color: var(--muted); align-items: center; }
.discards .dg { display: flex; gap: 2px; align-items: center; }
.mini { display: inline-grid; place-items: center; width: 16px; height: 20px; border-radius: 3px; font-size: 11px; font-variant-numeric: tabular-nums; color: #0b0e22; background: var(--cc); font-weight: 700; box-shadow: inset 0 0 0 1px rgba(0,0,0,.35); }
.mini.c-w { background: #f4f1ea; color: #0b0e22; outline: 1px solid #9ba1c4; }

.hintbar { font-size: 12.5px; color: var(--muted); text-align: center; }

/* sheets & overlays */
.scrim { position: fixed; inset: 0; z-index: 40; background: rgba(5,7,20,.62); display: flex; align-items: flex-end; justify-content: center; }
.scrim.center { align-items: center; }
.sheet { width: 100%; max-width: 560px; max-height: 86%; overflow-y: auto; background: var(--night-2); border: 1px solid var(--line); border-bottom: none; border-radius: 18px 18px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 12px; }
.scrim.center .sheet { border-radius: 18px; border-bottom: 1px solid var(--line); margin-inline: 16px; width: calc(100% - 32px); }
.sheet h2 { margin: 0; font-family: var(--f-head); font-size: 20px; text-wrap: balance; }
.sheet h3 { margin: 6px 0 0; font-family: var(--f-head); font-size: 16px; color: var(--gold); }
.sheet p, .sheet li { margin: 0; color: var(--ink); max-width: 62ch; }
.sheet ul, .sheet ol { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }
.sheet .sub { color: var(--muted); font-size: 13px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { flex: 1 1 140px; border-radius: 12px; padding: 12px 14px; border: 1px solid var(--line); background: rgba(255,255,255,.04); text-align: left; display: flex; flex-direction: column; gap: 2px; }
.btn b { font-family: var(--f-head); font-size: 16px; }
.btn span { font-size: 12.5px; color: var(--muted); }
.btn.primary { background: var(--gold); color: var(--night); border-color: var(--gold); }
.btn.primary span { color: rgba(10,14,34,.7); }
.btn.hint { border-color: var(--cc-soft); }
.btn.hint b { color: var(--cc); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn.warn { border-color: var(--danger); }
.btn.warn b { color: var(--danger); }
.close { align-self: flex-end; }

.lobby { margin: auto 0; display: flex; flex-direction: column; gap: 16px; align-items: stretch; padding-block: 16px; }
.hero { text-align: center; display: flex; flex-direction: column; gap: 4px; align-items: center; }
.hero .mark { font-family: var(--f-mark); font-size: 84px; line-height: 1; color: var(--gold); text-shadow: 0 0 30px rgba(233,181,79,.5); }
.hero h1 { margin: 0; font-family: var(--f-head); font-size: 22px; text-wrap: balance; }
.hero p { margin: 0; color: var(--muted); font-size: 14px; max-width: 34ch; }
.panel { border: 1px solid var(--line); border-radius: 16px; background: var(--panel); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.panel h2 { margin: 0; font-family: var(--f-head); font-size: 17px; }
.seats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.seat { border: 1px dashed var(--line); border-radius: 12px; padding: 10px; text-align: center; min-width: 0; }
.seat.filled { border-style: solid; border-color: var(--gold); background: var(--gold-soft); }
.seat .who { font-family: var(--f-head); font-size: 16px; overflow-wrap: anywhere; }
.seat .tag { font-size: 11px; color: var(--muted); }
label.fld { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; color: var(--muted); }
input[type=text] { font: inherit; color: var(--ink); background: rgba(0,0,0,.25); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.tabs { display: flex; gap: 6px; }
.tab { flex: 1; padding: 8px; border-radius: 10px; border: 1px solid var(--line); background: transparent; font-size: 13.5px; }
.tab[aria-pressed=true] { background: var(--gold-soft); border-color: var(--gold); color: var(--gold); }
.note { font-size: 12.5px; color: var(--muted); }
.err { font-size: 13px; color: var(--danger); }

.cover { position: fixed; inset: 0; z-index: 45; background: rgba(6,8,22,.93); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding-inline: 24px; text-align: center; }
.cover .mark { font-family: var(--f-mark); font-size: 54px; color: var(--gold); }
.cover h2 { margin: 0; font-family: var(--f-head); font-size: 22px; text-wrap: balance; }
.cover p { margin: 0; color: var(--muted); max-width: 36ch; }
.cover .btn { flex: 0 0 auto; min-width: 220px; text-align: center; align-items: center; }

.over .score { font-family: var(--f-mark); font-size: 72px; line-height: 1; color: var(--gold); text-align: center; text-shadow: 0 0 24px rgba(233,181,79,.5); }
.over .rank { text-align: center; font-family: var(--f-head); font-size: 18px; }

.toast { pointer-events: none; position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 70; background: var(--night-2); border: 1px solid var(--gold); color: var(--ink); padding: 8px 16px; border-radius: 999px; font-size: 13.5px; white-space: nowrap; max-width: calc(100% - 32px); overflow: hidden; text-overflow: ellipsis; }
.shake { animation: shake .45s ease; }
@keyframes shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-7px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(3px); } }
.flash { position: fixed; inset: 0; z-index: 55; pointer-events: none; background: radial-gradient(circle, rgba(255,80,80,.0) 30%, rgba(255,60,60,.35)); animation: flash .7s ease forwards; }
@keyframes flash { from { opacity: 1; } to { opacity: 0; } }

.roomhead { display: flex; align-items: center; gap: 10px; justify-content: space-between; }
.roomhead.small { margin-top: -4px; }
.code { font-family: var(--f-mark); font-size: 44px; letter-spacing: .25em; color: var(--gold); text-align: center; line-height: 1.1; text-shadow: 0 0 18px rgba(233,181,79,.4); }
.sharebox { display: flex; gap: 8px; align-items: center; }
.sharebox input { flex: 1; min-width: 0; font-size: 12.5px; }
.conn { font-size: 12px; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.conn.ok { border-color: var(--c-g); color: var(--c-g); }
.log { display: flex; flex-direction: column; gap: 6px; font-size: 13.5px; }
.log div { padding-bottom: 6px; border-bottom: 1px solid var(--line); }
.rulecards { display: flex; gap: 6px; flex-wrap: wrap; }
.rulecards .mini { width: 20px; height: 26px; font-size: 13px; }
.scoretable { border-collapse: collapse; font-size: 13.5px; width: 100%; }
.scoretable td { padding: 4px 6px; border-bottom: 1px solid var(--line); }
.scoretable td:first-child { font-variant-numeric: tabular-nums; color: var(--gold); white-space: nowrap; width: 70px; }

@media (max-width: 380px) { .hand, .stacks { gap: 5px; } .logo { font-size: 26px; } }
@media (prefers-reduced-motion: reduce) { .card.hinted { animation: none; } .shake { animation: none; } .card, button.card:hover { transition: none; } }
</style>

<canvas id="sky" aria-hidden="true"></canvas>
<div class="app" id="app"></div>
<canvas id="fx" aria-hidden="true"></canvas>
<div id="layer"></div>

<script>
(() => {
"use strict";

/* ───────── constants ───────── */
const COLORS = ["r", "y", "g", "b", "w"];
const CNAME = { r: "빨강", y: "노랑", g: "초록", b: "파랑", w: "하양" };
const CHEX = { r: "#ff4d5e", y: "#ffd23f", g: "#3fdc8a", b: "#4fa6ff", w: "#f4f1ea" };
const COPIES = [0, 3, 2, 2, 2, 1];
const HAND = 5, MAX_HINTS = 8, MAX_STRIKES = 3;
const DOC_PATH = "tables/main";
const reduceMotion = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ───────── small utils ───────── */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const rnd = n => { try { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; } catch { return Math.floor(Math.random() * n); } };
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
const josa = (word, a, b) => { const ch = word.charCodeAt(word.length - 1); if (ch < 0xac00 || ch > 0xd7a3) return word + a; return word + (((ch - 0xac00) % 28) ? a : b); };
// josa(name,"이","가") → 받침 있으면 "이", 없으면 "가"
const iga = n => josa(n, "이", "가");
const cardName = c => `${CNAME[c.c]} ${c.n}`;
const NUM_EUL = [, "을", "를", "을", "를", "를"], NUM_EUN = [, "은", "는", "은", "는", "는"];

/* ───────── game engine (pure) ───────── */
function makeDeck() {
  const d = []; let id = 0;
  for (const c of COLORS) for (let n = 1; n <= 5; n++) for (let k = 0; k < COPIES[n]; k++)
    d.push({ id: id++, c, n, kc: null, kn: null, xc: [], xn: [], fresh: false });
  for (let i = d.length - 1; i > 0; i--) { const j = rnd(i + 1); [d[i], d[j]] = [d[j], d[i]]; }
  return d;
}
function newGame(players, prevSeq) {
  const deck = makeDeck();
  const hands = [[], []];
  for (let i = 0; i < HAND; i++) for (let p = 0; p < 2; p++) hands[p].push(deck.pop());
  const first = rnd(2);
  return {
    v: 1, status: "playing", players: clone(players), hands, deck,
    stacks: { r: 0, y: 0, g: 0, b: 0, w: 0 }, discard: [],
    hints: MAX_HINTS, strikes: 0, turn: first, finalTurns: null,
    log: [`새 게임 시작! ${players[first].name} 님부터 시작해요.`],
    last: null, seq: (prevSeq || 0) + 1, endReason: null,
  };
}
const score = s => COLORS.reduce((a, c) => a + s.stacks[c], 0);
function draw(s, p) {
  for (const c of s.hands[p]) c.fresh = false;
  if (!s.deck.length) return null;
  const card = s.deck.pop(); card.fresh = true;
  s.hands[p].unshift(card);
  return card;
}
function endTurn(s) {
  if (s.strikes >= MAX_STRIKES) { s.status = "over"; s.endReason = "strikes"; }
  else if (score(s) === 25) { s.status = "over"; s.endReason = "perfect"; }
  else if (s.finalTurns !== null) {
    s.finalTurns -= 1;
    if (s.finalTurns <= 0) { s.status = "over"; s.endReason = "deck"; }
  } else if (s.deck.length === 0) {
    s.finalTurns = 2;
    s.log.push("덱이 바닥났어요. 이제 각자 마지막 한 번씩!");
  }
  if (s.status === "over") s.log.push(`게임 끝 — ${finalScore(s)}점`);
  s.turn = 1 - s.turn;
  s.seq += 1;
  if (s.log.length > 80) s.log = s.log.slice(-80);
  return s;
}
const finalScore = s => s.endReason === "strikes" ? 0 : score(s);

function actPlay(s0, p, idx) {

const burstCache = {};

  for (let ring = 0; ring < Math.min(n, 3); ring++) {
    const r1 = 9 + ring * 9, r2 = r1 + 7;
    for (let i = 0; i < rays; i++) {
      const a = (i / rays) * Math.PI * 2 + ring * 0.21;
      const x1 = 50 + Math.cos(a) * r1, y1 = 50 + Math.sin(a) * r1;
      const x2 = 50 + Math.cos(a) * r2, y2 = 50 + Math.sin(a) * r2;
      parts.push(`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}"/>`);
      parts.push(`<circle cx="${x2.toFixed(1)}" cy="${y2.toFixed(1)}" r="${ring === 2 ? 1.1 : 1.5}" fill="currentColor"/>`);
    }
  }
  if (n >= 4) for (let i = 0; i < 6; i++) { const a = i / 6 * Math.PI * 2 + .5; parts.push(`<circle cx="${(50 + Math.cos(a) * 44).toFixed(1)}" cy="${(50 + Math.sin(a) * 44).toFixed(1)}" r="1.2" fill="currentColor"/>`); }

}

async function commit(next) {
  if (!next) return;
  if (ui.mode === "local") {
    const prev = ui.local;
    ui.local = next; store.set("hanabi-local", next);
    ui.sheet = null;
    if (next.status === "playing") ui.localGate = true;
    maybeAnimate("local", next, prev);
    render();
    return;
  }
  if (ui.net === "peer") {
    const prev = ui.online;
    ui.online = next; saveRoom(); ui.sheet = null;
    send({ t: "sync", state: next });
    maybeAnimate("online", next, prev);
    render();

  }
  if (ui.busy) return;
  ui.busy = true; ui.sheet = null;
  try { await ui.ref.set(next); ui.error = ""; }
  catch (e) {
    if (e && e.code === "invalid_argument") { ui.canWrite = false; ui.error = "이 계정은 테이블에 쓸 권한이 없어요. 페이지 주인에게 '편집자'로 초대해 달라고 하세요."; }

    } else ui.error = "저장하지 못했어요. 잠시 후 다시 해 주세요.";
  }

  else action = `<p class="note">${ui.peerStatus === "nohost" ? "방을 찾고 있어요. 방을 만든 사람이 페이지를 열어 두었는지 확인해 주세요." : "방에 연결하는 중…"}</p>`;
  return `<div class="lobby">${heroHTML()}
    <div class="panel">
      <div class="roomhead"><h2>방 코드</h2>${connPill()}</div>
      <div class="code">${esc(ui.room)}</div>
      ${ui.isHost ? `<div class="sharebox"><input type="text" id="share-link" readonly value="${esc(shareLink())}" aria-label="초대 링크"><button class="iconbtn" data-act="copy">링크 복사</button></div>` : ""}
      <div class="seats">${seats}</div>
      ${action}
      ${ui.error ? `<p class="err">${esc(ui.error)}</p>` : ""}
    </div>
    <div class="row"><button class="btn" data-act="rules"><b>규칙 보기</b><span>처음이라면 3분이면 충분해요</span></button>
      <button class="btn warn" data-act="room-leave" data-key="room-leave"><b>${ui.armed === "room-leave" ? "정말 나갈까요? 한 번 더 누르기" : "방 나가기"}</b><span>다른 방을 만들거나 들어가요</span></button></div>
  </div>`;
}

/* ───────── rendering ───────── */
function render() {
  const app = $("#app");
  const s = current();
  let html = "";
  if (ui.mode === "online" && ui.net === "peer") html = !ui.room ? roomEntryHTML() : (!s || s.status === "lobby") ? peerLobbyHTML(s) : tableHTML(s);
  else if (ui.mode === "online" && !ui.db) html = ui.dbChecked ? lobbyLocalHTML() : loadingHTML();
  else if (ui.mode === "online") html = (!ui.dbReady) ? loadingHTML() : (!s || s.status === "lobby") ? lobbyOnlineHTML(s) : tableHTML(s);
  else html = (!s) ? lobbyLocalHTML() : tableHTML(s);
  app.innerHTML = html;
  renderLayer(s);
}

function loadingHTML() {
  return `<div class="lobby"><div class="hero"><div class="mark">花火</div><p>테이블을 준비하고 있어요…</p></div></div>`;
}
function modeTabs() { return ""; }
function heroHTML() {
  const back = window.claude ? "" : `<a class="iconbtn" href="../" style="align-self:flex-start">← 다른 게임</a>`;
  return `${back}<div class="hero"><div class="mark">花火</div><h1>둘이서 하나비</h1><p>서로의 카드는 보이지만 내 카드는 안 보여요. 힌트만으로 밤하늘에 25발의 불꽃을 완성해 보세요.</p></div>`;
}
function lobbyOnlineHTML(s) {
  const players = (s && s.players) || [];
  const me = players.findIndex(p => p.id === ui.myId);
  const seats = [0, 1].map(i => {
    const p = players[i];
    return `<div class="seat ${p ? "filled" : ""}"><div class="tag">${i + 1}번 자리${p && p.id === ui.myId ? " · 나" : ""}</div><div class="who">${p ? esc(p.name) : "빈 자리"}</div></div>`;
  }).join("");
  let action;
  if (!ui.canWrite) action = `<p class="err">이 계정은 보기만 할 수 있어요. 페이지 주인에게 '편집자'로 초대해 달라고 하세요.</p>`;
  else if (me < 0 && players.length < 2) action = `
    <label class="fld" for="name-in">내 이름<input type="text" id="name-in" maxlength="12" placeholder="예: 지우" value="${esc(ui.name)}"></label>
    <div class="row"><button class="btn primary" data-act="sit"><b>자리에 앉기</b><span>둘 다 앉으면 게임을 시작할 수 있어요</span></button></div>`;
  else if (me < 0) action = `<p class="note">두 자리가 모두 찼어요. 둘 중 한 명이 아니라면 아래에서 테이블을 비울 수 있어요.</p>`;
  else if (players.length < 2) action = `<p class="note">상대가 같은 링크로 들어와서 앉기를 기다리는 중…</p>
    <div class="row"><button class="btn" data-act="leave"><b>자리 비우기</b><span>이름을 바꾸고 싶을 때</span></button></div>`;
  else action = `<div class="row"><button class="btn primary" data-act="start"><b>불꽃놀이 시작</b><span>카드를 섞고 5장씩 나눠요</span></button>
    <button class="btn" data-act="leave"><b>자리 비우기</b><span>이름 바꾸기</span></button></div>`;
  return `<div class="lobby">${heroHTML()}
    <div class="panel">${modeTabs()}
      <h2>온라인 테이블</h2>
      <div class="seats">${seats}</div>
      ${action}
      ${ui.error ? `<p class="err">${esc(ui.error)}</p>` : ""}
      <p class="note">같은 페이지를 연 두 사람이 한 테이블에 앉아요. 각자 자기 폰에서 내 카드는 가려지고 상대 카드만 보여요.</p>
    </div>
    <div class="row"><button class="btn" data-act="rules"><b>규칙 보기</b><span>처음이라면 3분이면 충분해요</span></button>
    ${players.length ? `<button class="btn warn" data-act="reset" data-key="reset-lobby"><b>${ui.armed === "reset-lobby" ? "정말 비울까요? 한 번 더 누르기" : "테이블 비우기"}</b><span>앉은 사람을 모두 내보내요</span></button>` : ""}</div>
  </div>`;
}
function lobbyLocalHTML() {
  return `<div class="lobby">${heroHTML()}
    <div class="panel"><h2>이 브라우저에서는 연결할 수 없어요</h2>
      <p class="note">이 브라우저는 폰끼리 연결하는 기능을 지원하지 않아요. 크롬이나 사파리 최신 버전으로 열어 주세요.</p></div>
    <div class="row"><button class="btn" data-act="rules"><b>규칙 보기</b><span>처음이라면 3분이면 충분해요</span></button></div>
  </div>`;
}

function tableHTML(s) {
  const me = mySeat(s);
  const spectator = me < 0;
  const viewer = spectator ? 0 : me;
  const partner = 1 - viewer;
  const myTurn = !spectator && s.turn === me && s.status === "playing";
  const P = s.players;
  const hintIds = s.last && s.last.type === "hint" ? s.last.ids : [];
  const sel = ui.sheet && ui.sheet.kind !== "rules" && ui.sheet.kind !== "log" ? ui.sheet : null;
  const previewIds = sel && sel.kind === "hint" && sel.preview ? sel.preview : [];

  const status = `<div class="status" role="status">
    <span class="tok"><span class="lbl">힌트</span><span class="dots">${Array.from({ length: MAX_HINTS }, (_, i) => `<span class="dot ${i < s.hints ? "on" : ""}"></span>`).join("")}</span><span class="num">${s.hints}</span></span>
    <span class="tok"><span class="lbl">실패</span><span class="dots">${Array.from({ length: MAX_STRIKES }, (_, i) => `<span class="fuse ${i < s.strikes ? "on" : ""}"></span>`).join("")}</span></span>
    <span class="tok"><span class="lbl">덱</span><span class="num">${s.deck.length}</span></span>
    <span class="tok"><span class="lbl">점수</span><span class="num">${score(s)}</span><span class="lbl">/25</span></span>
    ${s.finalTurns !== null && s.status === "playing" ? `<span class="tok" style="color:var(--gold)">마지막 ${s.finalTurns}턴</span>` : ""}
  </div>`;

  const partnerHand = s.hands[partner].map((c, i) => {
    const cls = [hintIds.includes(c.id) ? "hinted" : "", previewIds.includes(c.id) ? "preview" : "", c.fresh ? "newcard" : "", sel && sel.kind === "hint" && sel.idx === i ? "selected" : ""].join(" ");
    return `<div class="slot">${faceHTML(c, cls, "button", `data-act="pcard" data-i="${i}" ${myTurn ? "" : "disabled"}`)}${theyKnowHTML(c)}</div>`;
  }).join("");

  const myHand = s.hands[viewer].map((c, i) => {
    const cls = [hintIds.includes(c.id) ? "hinted" : "", c.fresh ? "newcard" : "", sel && sel.kind === "mine" && sel.idx === i ? "selected" : ""].join(" ");
    if (spectator) return `<div class="slot">${faceHTML(c, cls)}${theyKnowHTML(c)}</div>`;
    return `<div class="slot">${backHTML(c, cls, "button", `data-act="mcard" data-i="${i}" ${myTurn ? "" : "disabled"}`)}${possHTML(c)}</div>`;
  }).join("");

  const stacks = COLORS.map(c => {
    const n = s.stacks[c];
    return `<div class="stack c-${c} ${n === 5 ? "done" : ""}" data-stack="${c}">
      ${n ? `<div class="pile has">${faceHTML({ c, n })}</div>` : `<div class="pile"><span class="zero">0</span></div>`}
      <span class="lbl">${CNAME[c]} ${n}/5</span></div>`;
  }).join("");

  const dsorted = [...s.discard].sort((a, b) => COLORS.indexOf(a.c) - COLORS.indexOf(b.c) || a.n - b.n);
  const dgroups = COLORS.map(c => {
    const cards = dsorted.filter(x => x.c === c);
    return cards.length ? `<span class="dg">${cards.map(x => `<span class="mini c-${x.c}" title="${cardName(x)}">${x.n}</span>`).join("")}</span>` : "";
  }).join("");
  const lastText = s.log.length ? s.log[s.log.length - 1] : "";

  let turnText;
  if (s.status !== "playing") turnText = "게임이 끝났어요.";
  else if (spectator) turnText = `${esc(P[s.turn].name)} 님 차례 (관전 중)`;
  else if (myTurn) turnText = "내 차례 — 상대 카드를 눌러 힌트를 주거나, 내 카드를 눌러 내거나 버리세요.";
  else turnText = `${esc(P[partner].name)} 님이 고민 중이에요…`;

  return `
  <div class="bar">${window.claude ? "" : `<a class="iconbtn back" href="../" aria-label="게임 목록">←</a>`}<span class="logo">花火<small>HANABI</small></span><span class="sp"></span>
    <button class="iconbtn" data-act="log">기록</button>
    <button class="iconbtn" data-act="rules">규칙</button>
    <button class="iconbtn" data-act="menu" aria-label="메뉴">⋯</button></div>
  ${ui.net === "peer" && ui.mode === "online" ? `<div class="roomhead small"><span class="note">방 ${esc(ui.room)}</span>${connPill()}</div>` : ""}
  ${status}
  <section class="side" aria-label="상대 손패">
    <div class="side-head"><b>${esc(spectator ? P[partner].name : P[partner].name)}</b><span>${spectator ? "의 카드" : "의 카드 · 아래는 상대가 아는 정보"}</span>${s.turn === partner && s.status === "playing" ? `<span class="turnpill">차례</span>` : ""}</div>
    <div class="hand">${partnerHand}</div>
  </section>
  <section class="field" aria-label="불꽃 더미">
    <div class="stacks" id="stacks">${stacks}</div>
    <div class="lastline" aria-live="polite">${esc(lastText)}</div>
    <div class="discards"><span>버린 카드</span>${dgroups || "<span>없음</span>"}</div>
  </section>
  <section class="side" aria-label="내 손패">
    <div class="side-head"><b>${spectator ? esc(P[viewer].name) : "나 (" + esc(P[viewer].name) + ")"}</b><span>${spectator ? "의 카드" : "· 점·숫자는 힌트로 좁혀진 가능성"}</span>${s.turn === viewer && s.status === "playing" ? `<span class="turnpill">차례</span>` : ""}</div>
    <div class="hand">${myHand}</div>
  </section>
  <p class="hintbar">${turnText}</p>
  ${ui.error ? `<p class="err" style="text-align:center">${esc(ui.error)}</p>` : ""}`;
}

/* overlays: sheets, covers, game over */
function renderLayer(s) {
  const L = $("#layer");
  let h = "";
  const sh = ui.sheet;
  if (s && s.status === "over" && (!sh || sh.kind === "menu")) h += overHTML(s);
  else if (ui.mode === "local" && s && s.status === "playing" && ui.localGate && !sh) h += coverHTML(s);
  if (sh) h += sheetHTML(sh, s);
  L.innerHTML = h;
}
function coverHTML(s) {
  const nm = s.players[s.turn].name;
  let lastHTML = "";
  if (s.last) lastHTML = `<p>방금: ${esc(s.log[s.log.length - 1])}</p>`;
  return `<div class="cover" role="dialog" aria-modal="true" aria-label="차례 넘기기">
    <div class="mark">花火</div>
    <h2>${esc(nm)} 님 차례예요</h2>
    ${lastHTML}
    <p>${esc(iga(nm))} 아닌 사람은 화면을 보지 말고 폰을 넘겨 주세요.</p>
    <button class="btn primary" data-act="ungate"><b>${esc(nm)}, 내 차례 보기</b></button>
  </div>`;
}
function overHTML(s) {
  const sc = finalScore(s);
  const why = s.endReason === "strikes" ? "불발이 세 번 나서 불꽃놀이가 중단됐어요. 공식 규칙으로는 0점이에요." : s.endReason === "perfect" ? "다섯 색 모두 5까지 완성!" : "덱이 다 떨어져서 불꽃놀이가 끝났어요.";
  const canAct = ui.mode === "local" || (mySeat(s) >= 0 && ui.canWrite);
  return `<div class="scrim center"><div class="sheet over" role="dialog" aria-modal="true" aria-label="게임 결과">
    <div class="score">${sc}<span style="font-size:24px;color:var(--muted)">/25</span></div>
    <div class="rank">${rankFor(sc)}</div>
    <p class="sub" style="text-align:center">${why}${s.endReason === "strikes" ? ` (쌓은 불꽃 ${score(s)}점)` : ""}</p>
    ${canAct ? `<div class="row"><button class="btn primary" data-act="again"><b>한 판 더</b><span>같은 둘이서 바로 다시</span></button>
      <button class="btn" data-act="tolobby"><b>처음 화면</b><span>${ui.mode === "local" ? "이름 바꾸기" : "자리 다시 정하기"}</span></button></div>` : ""}
    <button class="iconbtn close" data-act="peek" style="align-self:center">판 다시 보기</button>
  </div></div>`;
}
function sheetHTML(sh, s) {
  if (sh.kind === "rules") return wrapSheet(rulesHTML(), "규칙");
  if (sh.kind === "log") return wrapSheet(`<h2>지금까지의 기록</h2><div class="log">${(s ? s.log : []).slice().reverse().map(t => `<div>${esc(t)}</div>`).join("") || "<div>아직 기록이 없어요.</div>"}</div>`, "기록");
  if (sh.kind === "peek") return "";
  if (sh.kind === "menu") {
    const k = ui.armed;
    return wrapSheet(`<h2>메뉴</h2>
      <div class="row" style="flex-direction:column">
        <button class="btn warn" data-act="restart" data-key="restart"><b>${k === "restart" ? "정말 새로 시작할까요? 한 번 더 누르기" : "이 판 그만두고 새 게임"}</b><span>같은 두 사람으로 카드를 다시 섞어요</span></button>
        <button class="btn warn" data-act="tolobby" data-key="tolobby"><b>${k === "tolobby" ? "정말 나갈까요? 한 번 더 누르기" : "처음 화면으로"}</b><span>${ui.mode === "online" ? "자리를 다시 정해요 (상대도 함께 이동)" : "이름을 다시 정해요"}</span></button>
        ${ui.net === "peer" && ui.mode === "online" && ui.room ? `<button class="btn warn" data-act="room-leave" data-key="room-leave"><b>${k === "room-leave" ? "정말 나갈까요? 한 번 더 누르기" : "방 나가기"}</b><span>이 방을 떠나요. 같은 코드로 다시 들어올 수 있어요</span></button>` : ""}
      </div>`, "메뉴");
  }
  if (!s) return "";
  const me = mySeat(s);
  if (sh.kind === "mine") {
    const c = s.hands[me][sh.idx];
    if (!c) return "";
    const { cs, ns } = possible(c);
    const known = `${c.kc ? CNAME[c.kc] : "색 모름"} · ${c.kn ? c.kn : "숫자 모름"}`;
    const poss = `가능한 색: ${cs.map(x => CNAME[x]).join(", ")} / 가능한 숫자: ${ns.join(", ")}`;
    const full = s.hints >= MAX_HINTS;
    return wrapSheet(`<h2>왼쪽에서 ${sh.idx + 1}번째 내 카드</h2>
      <p class="sub">${known}<br>${poss}</p>
      <div class="row">
        <button class="btn primary" data-act="play" data-i="${sh.idx}"><b>쏘아 올리기</b><span>맞는 숫자면 불꽃 성공, 틀리면 실패 1회</span></button>
        <button class="btn" data-act="discard" data-i="${sh.idx}" ${full ? "disabled" : ""}><b>버리기</b><span>${full ? "힌트가 가득(8개)이라 버릴 수 없어요" : "힌트 토큰 1개를 되찾아요"}</span></button>
      </div>`, "내 카드");
  }
  if (sh.kind === "hint") {
    const t = 1 - me;
    const c = s.hands[t][sh.idx];
    if (!c) return "";
    const nm = s.players[t].name;
    const cCount = s.hands[t].filter(x => x.c === c.c).length;
    const nCount = s.hands[t].filter(x => x.n === c.n).length;
    const none = s.hints <= 0;
    return wrapSheet(`<h2>${esc(nm)} 님에게 힌트 주기</h2>
      <p class="sub">${none ? "힌트 토큰이 없어요. 내 카드를 버려서 되찾을 수 있어요." : "고른 정보에 해당하는 카드가 모두 알려져요. 힌트 토큰 1개를 써요."}</p>
      <div class="row">
        <button class="btn hint c-${c.c}" data-act="hint" data-k="c" data-v="${c.c}" data-prev="c" ${none ? "disabled" : ""}><b>"${CNAME[c.c]}"이라고 알려주기</b><span>${cCount}장이 표시돼요</span></button>
        <button class="btn hint" data-act="hint" data-k="n" data-v="${c.n}" data-prev="n" ${none ? "disabled" : ""}><b>"숫자 ${c.n}"이라고 알려주기</b><span>${nCount}장이 표시돼요</span></button>
      </div>`, "힌트");
  }
  return "";
}
function wrapSheet(inner, label) {
  return `<div class="scrim" data-act="closesheet"><div class="sheet" role="dialog" aria-modal="true" aria-label="${label}" data-stop="1">
    <button class="iconbtn close" data-act="closesheet">닫기</button>${inner}</div></div>`;
}
function rulesHTML() {
  const deck = [1, 1, 1, 2, 2, 3, 3, 4, 4, 5].map(n => `<span class="mini c-r">${n}</span>`).join("");
  return `<h2>하나비 규칙 (2인)</h2>
  <p>하나비(花火)는 일본어로 '불꽃놀이'예요. 둘이 한 팀이 되어 다섯 색의 불꽃을 1부터 5까지 순서대로 쏘아 올리는 협력 게임이에요. 이기고 지는 상대는 없고, 둘이 함께 몇 점을 만드느냐가 전부예요.</p>
  <h3>가장 중요한 규칙</h3>
  <ul><li><b>내 카드는 나만 못 봐요.</b> 상대 카드는 다 보여요.</li>
  <li>카드 정보는 <b>힌트로만</b> 전해요. "그거 내지 마!" 같은 말이나 표정 신호는 반칙이에요.</li></ul>
  <h3>카드</h3>
  <p>빨강·노랑·초록·파랑·하양 다섯 색. 색마다 아래처럼 10장, 모두 50장이에요.</p>
  <div class="rulecards">${deck}</div>
  <p class="sub">1은 3장, 2·3·4는 2장씩, 5는 딱 1장. 그래서 5는 버리면 그 색은 영영 완성 못 해요.</p>
  <h3>준비</h3>
  <p>각자 5장씩 받아요. 힌트 토큰 8개로 시작하고, 실패는 3번까지 버틸 수 있어요.</p>
  <h3>내 차례에는 셋 중 하나만</h3>
  <ol>
    <li><b>힌트 주기</b> (힌트 토큰 1개 사용): 상대 카드에서 <b>색 하나</b> 또는 <b>숫자 하나</b>를 골라 해당하는 카드를 <b>전부</b> 알려줘요. 예: "이 두 장이 파랑이야." 해당 카드가 최소 1장은 있어야 해요.</li>
    <li><b>버리기</b> (힌트 토큰 1개 회복): 내 카드 한 장을 버리고 새로 한 장 뽑아요. 토큰이 8개 가득이면 버릴 수 없어요.</li>
    <li><b>쏘아 올리기</b>: 내 카드 한 장을 내요. 그 색 더미의 다음 숫자면 성공해서 불꽃이 올라가요. 아니면 불발 — 카드는 버려지고 실패가 1회 쌓여요. 어느 쪽이든 새로 한 장 뽑아요. 5를 성공시키면 힌트 토큰 1개를 보너스로 받아요.</li>
  </ol>
  <h3>게임이 끝나는 때</h3>
  <ul><li>불발이 3번 나면 즉시 끝. 공식 규칙으로는 0점이에요.</li>
  <li>다섯 색 모두 5까지 쌓으면 25점 만점으로 끝.</li>
  <li>덱의 마지막 카드를 뽑으면, 뽑은 사람까지 포함해 각자 한 번씩 더 하고 끝나요.</li></ul>
  <h3>점수</h3>
  <table class="scoretable"><tbody>
    <tr><td>0–5점</td><td>관객들이 야유를 보내요</td></tr>
    <tr><td>6–10점</td><td>평범한 불꽃놀이</td></tr>
    <tr><td>11–15점</td><td>괜찮았어요, 박수 짝짝</td></tr>
    <tr><td>16–20점</td><td>훌륭해요, 다들 감탄</td></tr>
    <tr><td>21–24점</td><td>놀라워요, 오래 기억될 밤</td></tr>
    <tr><td>25점</td><td>전설의 불꽃놀이</td></tr>
  </tbody></table>
  <h3>이 화면 보는 법</h3>
  <ul><li>상대 카드를 누르면 그 카드의 색이나 숫자로 힌트를 줄 수 있어요. 누르는 순간 몇 장이 표시될지 미리 보여요.</li>
  <li>내 카드를 누르면 쏘아 올리거나 버릴 수 있어요.</li>
  <li>내 카드 아래 색 점과 숫자는 지금까지 받은 힌트로 좁혀진 <b>가능한 색·숫자</b>예요. 아무것도 없으면 아직 정보가 없다는 뜻이에요.</li>
  <li>상대 카드 아래 작은 칸은 <b>상대가 자기 카드에 대해 아는 것</b>이에요.</li>
  <li>방금 힌트를 받은 카드는 위아래로 반짝여요. 새로 뽑은 카드는 항상 맨 왼쪽에 들어와요.</li></ul>
  <h3>처음 하는 커플을 위한 팁</h3>
  <ul><li>보통 오른쪽(가장 오래된) 카드부터 버리는 게 약속이에요. 그래서 상대 오른쪽 끝에 중요한 카드가 있으면 먼저 힌트로 지켜 주세요.</li>
  <li>5와, 이미 한 장이 버려진 카드는 마지막 한 장일 수 있어요. 버리기 전에 버린 카드 목록을 확인하세요.</li>
  <li>"1이야"라는 힌트는 대개 "바로 내도 돼"라는 뜻으로 써요. 둘만의 약속을 미리 정해도 좋아요.</li></ul>`;
}

/* ───────── events ───────── */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  if (el.dataset.act === "closesheet" && e.target.closest("[data-stop]") && !e.target.closest("button[data-act=closesheet]")) return;
  const act = el.dataset.act;
  const s = current();
  const keyed = el.dataset.key;
  if (keyed && ui.armed !== keyed) { ui.armed = keyed; render(); setTimeout(() => { if (ui.armed === keyed) { ui.armed = null; render(); } }, 4000); return; }
  ui.armed = null;
  switch (act) {
    case "mode": ui.mode = el.dataset.v; store.set("hanabi-mode", ui.mode); ui.sheet = null; ui.error = ""; ui.localGate = true; render(); break;
    case "rules": ui.sheet = { kind: "rules" }; render(); break;
    case "room-create": case "room-join": {
      const nm = ($("#name-in").value || "").trim().slice(0, 12);
      if (!nm) { toast("이름을 먼저 적어 주세요"); $("#name-in").focus(); return; }
      ui.name = nm; store.set("hanabi-name", nm);
      if (act === "room-create") { openRoom(newCode(), true); break; }
      const code = ($("#code-in").value || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
      if (code.length < 4) { toast("방 코드를 확인해 주세요"); $("#code-in").focus(); return; }
      openRoom(code, false); break;
    }
    case "room-leave": ui.sheet = null; leaveRoom(); break;
    case "copy": {
      const link = shareLink(), inp = $("#share-link");
      const fallback = () => { if (inp) { inp.focus(); inp.select(); } toast("링크를 길게 눌러 복사해 주세요"); };
      try { navigator.clipboard.writeText(link).then(() => toast("링크를 복사했어요. 카톡으로 보내 주세요"), fallback); } catch { fallback(); }
      break;
    }
    case "log": ui.sheet = { kind: "log" }; render(); break;
    case "menu": ui.sheet = { kind: "menu" }; render(); break;
    case "closesheet": ui.sheet = null; render(); break;
    case "peek": ui.sheet = { kind: "peek" }; render(); toast("다 봤으면 메뉴(⋯)에서 새 게임을 시작하세요"); break;
    case "ungate": ui.localGate = false; render(); break;
    case "sit": {
      const nm = ($("#name-in").value || "").trim().slice(0, 12);
      if (!nm) { toast("이름을 먼저 적어 주세요"); $("#name-in").focus(); return; }
      ui.name = nm; store.set("hanabi-name", nm);
      const base = s && s.status === "lobby" ? clone(s) : { v: 1, status: "lobby", players: [], seq: (s && s.seq) || 0 };
      if (base.players.length >= 2) return;
      base.players.push({ id: ui.myId, name: nm });
      commit(base); break;
    }
    case "leave": {
      const base = clone(s); base.players = base.players.filter(p => p.id !== ui.myId); commit(base); break;
    }
    case "reset": commit({ v: 1, status: "lobby", players: [], seq: ((s && s.seq) || 0) + 1 }); break;
    case "start": if (s && s.players.length === 2) commit(newGame(s.players, s.seq)); break;
    case "local-start": {
      const a = ($("#ln0").value || "").trim().slice(0, 12) || "첫째";
      const b = ($("#ln1").value || "").trim().slice(0, 12) || "둘째";
      ui.localNames = [a, b]; store.set("hanabi-local-names", ui.localNames);
      ui.localGate = true;
      commit(newGame([{ id: "L0", name: a }, { id: "L1", name: b }], ui.local && ui.local.seq));
      break;
    }
    case "mcard": { const i = +el.dataset.i; ui.sheet = { kind: "mine", idx: i }; render(); break; }
    case "pcard": {
      const i = +el.dataset.i; ui.sheet = { kind: "hint", idx: i, preview: null }; render(); break;
    }
    case "play": { const me = mySeat(s); if (me === s.turn) commit(actPlay(s, me, +el.dataset.i)); break; }
    case "discard": { const me = mySeat(s); if (me === s.turn) { const n = actDiscard(s, me, +el.dataset.i); if (!n) toast("힌트가 가득해서 버릴 수 없어요"); else commit(n); } break; }
    case "hint": {
      const me = mySeat(s); if (me !== s.turn) return;
      const k = el.dataset.k; const v = k === "c" ? el.dataset.v : +el.dataset.v;
      const n = actHint(s, me, k, v); if (!n) toast("힌트 토큰이 없어요"); else commit(n);
      break;
    }
    case "again": if (s) commit(newGame(s.players, s.seq)); break;
    case "restart": if (s) { ui.sheet = null; commit(newGame(s.players, s.seq)); } break;
    case "tolobby":
      ui.sheet = null;
      if (ui.mode === "local") { ui.local = null; store.set("hanabi-local", null); render(); }
      else commit({ v: 1, status: "lobby", players: (s && s.players) || [], seq: ((s && s.seq) || 0) + 1 });
      break;
  }
});
// hint preview: hovering / focusing a hint option highlights the cards it would point at
function previewFrom(el) {
  const s = current(); if (!s || !ui.sheet || ui.sheet.kind !== "hint") return;
  const t = 1 - mySeat(s);
  let ids = null;
  if (el) { const k = el.dataset.k; const v = k === "c" ? el.dataset.v : +el.dataset.v; ids = s.hands[t].filter(c => k === "c" ? c.c === v : c.n === v).map(c => c.id); }
  const cur = JSON.stringify(ui.sheet.preview); if (cur === JSON.stringify(ids)) return;
  ui.sheet.preview = ids;
  document.querySelectorAll(".hand .card").forEach(n => n.classList.remove("preview"));
  if (ids) { const btns = document.querySelectorAll('section[aria-label="상대 손패"] .card'); s.hands[t].forEach((c, i) => { if (ids.includes(c.id) && btns[i]) btns[i].classList.add("preview"); }); }
}
document.addEventListener("pointerover", e => { const b = e.target.closest("[data-prev]"); previewFrom(b); });
document.addEventListener("focusin", e => { const b = e.target.closest("[data-prev]"); if (b) previewFrom(b); });
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && ui.sheet) { ui.sheet = null; render(); }
  if (e.key === "Enter" && (e.target.id === "name-in" || e.target.id === "code-in")) { const b = $('[data-act="sit"]') || (e.target.id === "code-in" || ui.joinCode ? $('[data-act="room-join"]') : $('[data-act="room-create"]')); if (b) b.click(); }
});

let toastTimer;
function toast(msg) {
  let t = $(".toast"); if (!t) { t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); document.body.appendChild(t); }
  t.textContent = msg; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), 2600);
}

/* ───────── fireworks ───────── */
const sky = $("#sky"), fx = $("#fx");
const sctx = sky.getContext("2d"), fctx = fx.getContext("2d");
let W = 0, H = 0, DPR = 1, stars = [];
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  for (const c of [sky, fx]) { c.width = W * DPR; c.height = H * DPR; c.getContext("2d").setTransform(DPR, 0, 0, DPR, 0, 0); }
  stars = Array.from({ length: Math.round(W * H / 5200) }, () => ({ x: Math.random() * W, y: Math.random() * H * .8, r: Math.random() * 1.1 + .2, p: Math.random() * 6.28, s: .5 + Math.random() * 1.5 }));
}
addEventListener("resize", resize); resize();

class Engine {
  constructor(ctx, alpha) { this.ctx = ctx; this.alpha = alpha; this.parts = []; this.rockets = []; }
  rocket(x, ty, color, size, onBurst, dud) {
    this.rockets.push({ x, y: H + 10, sx: x, ty, t: 0, dur: dud ? 48 : 42, color, size, onBurst, dud });
  }
  burst(x, y, color, size) {
    const n = Math.round(60 * size);
    const hex = CHEX[color] || color;
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, sp = (Math.random() * .7 + .5) * 3.4 * Math.sqrt(size);
      this.parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0, max: 60 + Math.random() * 40, c: hex, w: 1.6 });
    }
    for (let i = 0; i < n / 3; i++) {
      const a = Math.random() * Math.PI * 2, sp = Math.random() * 1.6;
      this.parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0, max: 80 + Math.random() * 30, c: "#fff6dc", w: 1, glitter: true });
    }
  }
  smoke(x, y) {
    for (let i = 0; i < 26; i++) { const a = Math.random() * 6.28, sp = Math.random() * 1.2; this.parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - .3, life: 0, max: 50 + Math.random() * 30, c: "#8a8fa8", w: 3, smoke: true }); }
  }
  get busy() { return this.parts.length || this.rockets.length; }
  step() {
    const ctx = this.ctx;
    ctx.globalCompositeOperation = "lighter";
    for (let i = this.rockets.length - 1; i >= 0; i--) {
      const r = this.rockets[i]; r.t++;
      const k = r.t / r.dur, e = 1 - Math.pow(1 - k, 3);
      const py = r.y; r.cy = (H + 10) + (r.ty - (H + 10)) * e;
      const wob = r.dud ? Math.sin(r.t * .6) * 3 : Math.sin(r.t * .3) * .8;
      ctx.strokeStyle = r.dud ? "rgba(200,190,170,.7)" : "rgba(255,230,180,.9)"; ctx.lineWidth = 2 * this.alpha;
      ctx.globalAlpha = this.alpha;
      ctx.beginPath(); ctx.moveTo(r.x + wob, r.cy + 14); ctx.lineTo(r.x + wob, r.cy); ctx.stroke();
      if (Math.random() < .6) this.parts.push({ x: r.x + wob, y: r.cy + 10, vx: (Math.random() - .5) * .6, vy: 1 + Math.random(), life: 0, max: 20, c: "#ffcf86", w: 1 });
      if (r.t >= r.dur) { this.rockets.splice(i, 1); if (r.dud) this.smoke(r.x, r.cy); else this.burst(r.x, r.cy, r.color, r.size); r.onBurst && r.onBurst(); }
    }
    for (let i = this.parts.length - 1; i >= 0; i--) {
      const p = this.parts[i]; p.life++;
      p.vx *= .975; p.vy = p.vy * .975 + (p.smoke ? -.01 : .045);
      const ox = p.x, oy = p.y; p.x += p.vx; p.y += p.vy;
      const f = 1 - p.life / p.max;
      if (f <= 0) { this.parts.splice(i, 1); continue; }
      let a = f * this.alpha; if (p.glitter) a *= (Math.random() < .5 ? 1 : .15);
      ctx.globalAlpha = p.smoke ? a * .35 : a;
      ctx.strokeStyle = p.c; ctx.lineWidth = p.w;
      ctx.beginPath(); ctx.moveTo(ox - p.vx * 2, oy - p.vy * 2); ctx.lineTo(p.x, p.y); ctx.stroke();
    }
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over";
  }
}
const ambient = new Engine(sctx, .32), show = new Engine(fctx, 1);
let nextAmbient = performance.now() + 2500, lastFrame = 0, running = false;
function loop(t) {
  running = true;
  if (t - lastFrame >= 16) {
    lastFrame = t;
    sctx.clearRect(0, 0, W, H);
    for (const s of stars) { const a = .35 + .35 * Math.sin(s.p + t / 1000 * s.s); sctx.globalAlpha = reduceMotion ? .5 : a; sctx.fillStyle = "#e8e4ff"; sctx.beginPath(); sctx.arc(s.x, s.y, s.r, 0, 6.28); sctx.fill(); }
    sctx.globalAlpha = 1;
    if (!reduceMotion && t > nextAmbient && !document.hidden) {
      nextAmbient = t + 5000 + Math.random() * 6000;
      ambient.rocket(W * (.1 + Math.random() * .8), H * (.12 + Math.random() * .25), COLORS[rnd(5)], .7);
    }
    ambient.step();
    fctx.clearRect(0, 0, W, H);
    show.step();
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

function stackPos(color) {
  const el = document.querySelector(`[data-stack="${color}"] .pile`);
  if (!el) return { x: W / 2, y: H * .4 };
  const r = el.getBoundingClientRect();
  return { x: r.left + r.width / 2, y: Math.max(60, r.top + r.height / 2) };
}
function maybeAnimate(which, s, prev) {
  const seen = ui.seenSeq[which];
  ui.seenSeq[which] = s.seq;
  if (seen === null || !s.last || s.seq <= seen || !prev) return;
  if (s.last.type !== "play") return;
  const { c, n } = s.last.card;
  // wait one frame so the new layout exists for positioning
  requestAnimationFrame(() => {
    const pos = stackPos(c);
    if (s.last.ok) {
      const ty = Math.max(70, pos.y - 30);
      if (reduceMotion) { show.burst(pos.x, ty, c, .6); return; }
      show.rocket(pos.x, ty, c, n === 5 ? 1.8 : 1 + n * .12);
      if (n === 5) {
        setTimeout(() => show.rocket(pos.x - 70, ty - 20, c, 1), 260);
        setTimeout(() => show.rocket(pos.x + 70, ty - 10, c, 1), 480);
      }
      if (score(s) === 25) COLORS.forEach((cc, i) => setTimeout(() => show.rocket(W * (.15 + i * .175), H * .25, cc, 1.6), 700 + i * 250));
    } else {
      if (!reduceMotion) show.rocket(pos.x, Math.max(80, pos.y - 10), c, 1, null, true);
      setTimeout(() => {
        const f = document.createElement("div"); f.className = "flash"; document.body.appendChild(f); setTimeout(() => f.remove(), 800);
        const app = $("#app"); if (!reduceMotion) { app.classList.remove("shake"); void app.offsetWidth; app.classList.add("shake"); }
        toast(`불발! ${CNAME[c]} ${n}${NUM_EUN[n]} 아직 낼 수 없었어요`);
      }, reduceMotion ? 0 : 800);
    }
  });
}

if (ui.local) ui.seenSeq.local = ui.local.seq;
boot();
})();
</script>
